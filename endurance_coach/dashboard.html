    const bounce = r.bounce_back.map((b) => `<tr><td>Morning ${b.morning}${b.morning === 1 ? " (the next day)" : ""}</td><td class="num">${has(b.hrv_pct) ? `${b.hrv_pct > 0 ? "+" : ""}${fmt(b.hrv_pct, 1)}%` : "–"}</td><td class="num">${has(b.rhr) ? `${b.rhr > 0 ? "+" : ""}${fmt(b.rhr, 1)}` : "–"}</td><td class="num">${has(b.sleep_score) ? `${b.sleep_score > 0 ? "+" : ""}${fmt(b.sleep_score, 1)}` : "–"}</td><td class="num">${b.n}</td></tr>`).join("");
    const eps = r.episodes.slice().reverse().map((e) => `<tr><td style="white-space:nowrap">${esc(dshort(e.start))} – ${esc(dshort(e.end))}</td><td class="num">${e.days}</td><td class="num">${e.red_days}</td><td>${esc(e.flags.join(", "))}</td><td class="num">${fmt(e.tss_7d_before)}</td></tr>`).join("");
    const weekly = r.weekly.slice().reverse().map((w) => `<tr><td>${esc(dshort(w.week_of))}</td><td class="num">${fmt(w.tss)}</td><td class="num">${fmt(w.hrv)}</td><td class="num">${fmt(w.rhr)}</td><td class="num">${fmt(w.sleep_h, 1)}</td><td class="num">${fmt(w.ctl)}</td>
      <td class="num">${["green", "amber", "red"].map((s) => `<span title="${STATUS[s].label}" style="color:${s === "amber" ? "var(--ink-2)" : STATUS[s].color}">${STATUS[s].icon}${w[s] || 0}</span>`).join(" ")}</td></tr>`).join("");
    return `<section class="card"><h1 class="headline">Recovery</h1><div class="subhead">How your body has been answering the training: every morning's readiness, and how fast big days are absorbed.</div>
        <div class="stats" style="margin-top:12px">${["green", "amber", "red"].map((s) => statBox(`<span style="color:${STATUS[s].color}">${STATUS[s].icon}</span> ${c[s]}`, `${STATUS[s].label} mornings · last 30 days`)).join("")}
          ${statBox(r.back_to_baseline_morning ? `${r.back_to_baseline_morning}<small>${r.back_to_baseline_morning === 1 ? "day" : "days"}</small>` : "–", "HRV back to baseline after a big day")}</div>
        ${r.summary.map((s) => `<div class="sub">${esc(s)}</div>`).join("")}</section>
      <section class="card"><h2>Readiness calendar <span class="muted">${esc(dshort(r.window.start))} – ${esc(dshort(r.window.end))}</span></h2>${recoveryCalendar(days)}
        <div class="legend" style="margin-top:8px">${["green", "amber", "red"].map((s) => `<span class="key"><span class="sw" style="background:${STATUS[s].color}"></span>${STATUS[s].icon} ${STATUS[s].label}</span>`).join("")}<span class="key"><span class="sw outline"></span>· no data</span></div></section>
      <section class="card"><h2>Load and response <span class="muted">same days on every row</span></h2>
        <div class="chart-label">Training load (TSS per day)</div><div class="chart" id="rc-tss"></div>
        <div class="chart-label">HRV (ms): nights as dots, 7-day average as the line, shaded your current 60-day normal range</div><div class="chart" id="rc-hrv"></div>
        <div class="chart-label">Resting HR (bpm)</div><div class="chart" id="rc-rhr"></div>
        <div class="chart-label">Sleep (h)</div><div class="chart" id="rc-sleep"></div>
        <div class="chart-label">Form (TSB): below −30 is deep fatigue</div><div class="chart" id="rc-tsb"></div></section>
      <div class="grid two"><section class="card"><h2>After big days <span class="muted">${r.big_day_tss ? `≥ ${fmt(r.big_day_tss)} TSS · ${r.big_days.length} days` : "not enough data"}</span></h2>
          ${bounce ? `<div class="scroll"><table><thead><tr><th>Morning</th><th class="num">HRV vs baseline</th><th class="num">RHR bpm</th><th class="num">Sleep score</th><th class="num">n</th></tr></thead><tbody>${bounce}</tbody></table></div>
          ${help("Baseline = your 30 days before each big day. A dip on morning 1 is normal; still down by morning 3 means space hard days further apart.")}` : '<div class="empty">Not enough big days yet.</div>'}</section>
        <section class="card"><h2>Strain episodes <span class="muted">2+ days of red or HRV / resting-HR flags</span></h2>
          ${eps ? `<div class="scroll"><table><thead><tr><th>When</th><th class="num">Days</th><th class="num">Red</th><th>Signals</th><th class="num">TSS 7 d before</th></tr></thead><tbody>${eps}</tbody></table></div>
          ${help("High load before = training strain. Low load before = look at illness, travel, heat, alcohol or life stress.")}` : '<div class="empty">None in this window.</div>'}</section></div>
      <section class="card"><details><summary>Week by week</summary><div class="scroll"><table style="margin-top:8px"><thead><tr><th>Week of</th><th class="num">TSS</th><th class="num">HRV</th><th class="num">RHR</th><th class="num">Sleep h</th><th class="num">CTL</th><th class="num">Mornings</th></tr></thead><tbody>${weekly}</tbody></table></div></details></section>`;
  });
}

// ---------------------------------------------------------------- Sports
const SPORT_TABS = ["swim", "bike", "run", "strength"];
function defaultSport() { return cycling() ? "bike" : "run"; }
function sessionsTable(list) {
  if (!list.length) return '<div class="empty">No sessions in the last 12 weeks.</div>';
  return `<div class="scroll"><table><thead><tr><th>Date</th><th>Session</th><th class="num">Time</th><th class="num">km</th><th class="num">Pace / speed</th><th class="num">TSS</th><th class="num">IF</th><th class="num">HR</th></tr></thead><tbody>
    ${list.map((a) => `<tr><td style="white-space:nowrap">${esc(dshort(a.start.slice(0, 10)))}</td><td><a href="${sessionHref(a.id)}">${esc(a.name || a.type || "")}</a></td><td class="num">${esc(a.time || "")}</td>
      <td class="num">${fmt(a.distance_km, a.sport === "swim" ? 2 : 1)}</td><td class="num">${esc(a.sport === "run" ? (a.pace_km ? a.pace_km + "/km" : "–") : a.sport === "swim" ? (a.pace_100m ? a.pace_100m + "/100m" : "–") : a.avg_speed_kmh ? fmt(a.avg_speed_kmh, 1) + " km/h" : "–")}</td>
      <td class="num">${fmt(a.tss)}</td><td class="num">${fmt(a.if, 2)}</td><td class="num">${fmt(a.avg_hr)}</td></tr>`).join("")}</tbody></table></div>`;
}

function viewSport(d, sport) {
  sport = SPORT_TABS.includes(sport) ? sport : defaultSport();
  return lazy(`/api/view/sport?sport=${sport}`, (s) => {
    const avail = SPORT_TABS.filter((x) => s.available.includes(x) || x === sport || (cycling() ? x === "bike" : ["swim", "bike", "run"].includes(x)));
    const seg = `<div class="seg" role="group" aria-label="Sport">${avail.map((x) => `<a href="#sports/${x}" ${x === sport ? 'aria-current="page"' : ""}>${esc(SPORT[x])}</a>`).join("")}</div>`;
    const P = s.periods, useKm = sport !== "strength";
    const per = (k, label) => { const x = P[k] || {}; return statBox(`${fmt(x.hours, 1)}<small>h</small>`, `${label}: ${x.sessions || 0} sessions${useKm && x.km ? ` · ${fmt(x.km, sport === "swim" ? 1 : 0)} km` : ""} · ${fmt(x.tss)} TSS${x.elevation_m ? ` · ${fmt(x.elevation_m)} m` : ""}`); };
    const unit = sport === "strength" ? "h" : "km";
    mount("sp-weeks", (c) => stackBars(c, s.weeks.map((w) => ({ key: w.week_of, label: w.current ? "this wk" : dshort(w.week_of), current: w.current,
      segs: [[unit === "km" ? w.km : w.hours, SPORT_COLOR[sport] || "var(--series-1)"]], mark: w.ramp_pct || w.long_share_pct ? "!" : "",
      tip: `<b>Week of ${esc(dshort(w.week_of))}</b><div>${w.sessions || 0} sessions · ${fmt(w.hours, 1)} h${w.km ? ` · ${fmt(w.km, 1)} km` : ""} · ${fmt(w.tss)} TSS</div>${w.longest_km ? `<div>Longest ${fmt(w.longest_km, 1)} km · ${fmt(w.longest_h, 1)} h</div>` : ""}${w.ramp_pct ? `<div>! +${fmt(w.ramp_pct)}% vs the week before</div>` : ""}${w.long_share_pct ? `<div>! long run ${fmt(w.long_share_pct)}% of the week</div>` : ""}` })), { height: 160, yfmt: (v) => `${fmt(v)}${unit}`, aria: `${sport} volume per week` }));
    const zcard = (z, label) => `<div><div class="section-label">${esc(label)}${z.hr_basis ? ` · HR zones on ${esc(z.hr_basis)}` : ""}</div>${threeZone(z.three_zone)}${zoneBars(z.hr)}
      ${z.power.length ? `<div class="section-label">Power zones</div>${zoneBars(z.power)}` : ""}${!z.hr.length && !z.power.length ? `<div class="empty">${!z.sessions_with_zones && !z.sessions_without ? "No sessions in this period." : `No zone data (${z.sessions_without} sessions without HR zones: set LTHR or max HR with the coach).`}</div>` : ""}</div>`;
    const T = s.trends || {};
    const trends = sport === "bike" ? [trendCard("sp-t1", "Outdoor speed", T.speed_outdoor, { dec: 1, label: "Outdoor ride", note: "km/h, terrain and wind dominate" }),
      trendCard("sp-t2", "Efficiency (NP / HR)", T.ef, { dec: 2, label: "Ride (IF < 0.80)" }), trendCard("sp-t3", "Cadence", T.cadence, { dec: 0, label: "Ride", note: "rpm" })]
      : sport === "run" ? [trendCard("sp-t1", "Pace", T.pace, { yfmt: paceFmt, invert: true, label: "Run", note: "per km, faster is higher" }), trendCard("sp-t2", "Efficiency", T.ef, { dec: 2, label: "Run (IF < 0.85)" }),
        trendCard("sp-t3", "Cadence", T.cadence, { dec: 0, label: "Run", note: "steps per minute" }), trendCard("sp-t4", "Long run per week", T.long_run_km, { dec: 1, label: "Week", note: "km" })]
      : sport === "swim" ? [trendCard("sp-t1", "Pool pace", T.pace, { yfmt: paceFmt, invert: true, label: "Swim", note: "per 100 m" }), trendCard("sp-t2", "Distance per swim", T.distance_km, { dec: 2, label: "Swim", note: "km" })] : [];
    const split = s.split ? `<div class="muted">Last 12 weeks: ${Object.entries(s.split).map(([k, v]) => `${esc(typeName(k))} ${v.sessions || 0}× ${fmt(v.hours, 1)} h`).join(" · ")}</div>` : "";
    const TH = { ftp: (v) => `FTP ${fmt(v)} W`, weight_kg: (v) => `${fmt(v, 1)} kg`, run_threshold: (v) => `Threshold pace ${v}/km`, lthr_run: (v) => `LTHR ${fmt(v)} bpm`, css: (v) => `CSS ${v}/100 m` };
    const th = s.thresholds ? Object.entries(s.thresholds).filter(([k, v]) => has(v) && TH[k]).map(([k, v]) => esc(TH[k](v))).join(" · ") : "";
    const preds = s.predictions ? `<div class="muted">${esc(watch())} predictions: ${Object.entries(s.predictions).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</div>` : "";
    return `${seg}<section class="card" style="margin-top:12px"><h1 class="headline">${esc(SPORT[sport])}</h1>${th ? `<div class="subhead">${th}</div>` : ""}
        <div class="stats" style="margin-top:12px">${per("7d", "7 days")}${per("28d", "4 weeks")}${per("84d", "12 weeks")}${per("365d", "12 months")}</div>${split}${preds}
        ${s.flags.length ? `<div style="margin-top:8px">${s.flags.map((f) => noteRow("warn", f)).join("")}</div>` : ""}</section>
      <section class="card"><h2>${unit === "km" ? "Distance" : "Hours"} per week <span class="muted">26 weeks${sport === "run" ? " · ! = more than +10% or a long run over 30% of the week" : ""}</span></h2><div class="chart" id="sp-weeks"></div></section>
      ${sport !== "strength" ? `<section class="card"><h2>Intensity</h2><div class="grid two">${zcard(s.zones_28d, "Last 4 weeks")}${zcard(s.zones_84d, "Last 12 weeks")}</div></section>` : ""}
      ${sport === "bike" ? powerCurveCard(s.power_curve, "sp-curve") : ""}
      <div class="grid two">${trends.join("")}</div>
      <section class="card"><h2>Sessions <span class="muted">last 12 weeks · opens the session</span></h2>${sessionsTable(s.sessions)}</section>`;
  });
}

// ---------------------------------------------------------------- Session detail
function viewSession(d, id) {
  const url = `/api/view/session/${id}`;
  if (!VIEWS[url]?.data) POST.push(() => { const c = document.querySelector("#app .empty"); if (c && c.textContent === "Loading…") c.textContent = "Loading… reading the FIT file; a long ride takes a few seconds the first time."; });
  return lazy(url, (x) => {
    const o = x.overview, m = x.metrics || {}, w = x.watch || {}, th = x.thresholds || {}, sp = o.sport;
    const nb = x.neighbours || {};
    const speed = sp === "run" ? (o.pace_km ? [`${o.pace_km}<small>/km</small>`, o.ngp_km && o.ngp_km !== o.pace_km ? `Pace · NGP ${o.ngp_km}` : "Pace"] : null)
      : sp === "swim" ? (o.pace_100m ? [`${o.pace_100m}<small>/100m</small>`, "Pace"] : null) : o.avg_speed_kmh ? [`${fmt(o.avg_speed_kmh, 1)}<small>km/h</small>`, "Speed"] : null;
    const dec = m.decoupling?.decoupling_pct;
    const stats = [[esc(o.time || "–"), "Moving time"], o.distance_km ? [`${fmt(o.distance_km, sp === "swim" ? 2 : 1)}<small>km</small>`, "Distance"] : null, speed,
      [o.tss ? fmt(o.tss) : "–", `TSS${o.tss_source ? " · " + o.tss_source : ""}`], o.if ? [fmt(o.if, 2), "Intensity factor"] : null,
      o.np ? [`${fmt(o.np)}<small>W</small>`, `NP · avg ${fmt(o.avg_power)} W${m.vi ? ` · VI ${fmt(m.vi, 2)}` : ""}`] : null,
      o.avg_hr ? [`${fmt(o.avg_hr)}<small>bpm</small>`, `Avg HR${m.max_hr ? ` · max ${fmt(m.max_hr)}` : ""}`] : null,
      o.elevation_m ? [`${fmt(o.elevation_m)}<small>m</small>`, "Climbing"] : null,
      has(dec) ? [`${fmt(dec, 1)}<small>%</small>`, `HR drift (decoupling)${dec < 5 ? " · solid" : dec > 8 ? " · high" : ""}`] : null,
      m.avg_cadence ? [fmt(m.avg_cadence), sp === "run" ? "Cadence spm" : "Cadence rpm"] : null,
      o.ef ? [fmt(o.ef, sp === "run" ? 3 : 2), "Efficiency"] : null, m.kj ? [`${fmt(m.kj)}<small>kJ</small>`, "Work"] : null]
      .filter(Boolean).map(([v, l]) => statBox(v, l)).join("");
    const watchBits = [w.aerobic_te !== undefined ? `Training effect ${w.aerobic_te}/${w.anaerobic_te}` : "", w.training_focus ? `focus ${w.training_focus}` : "", w.training_load ? `${watch()} load ${fmt(w.training_load)}` : "",
      w.perceived_effort ? `RPE ${w.perceived_effort}` : "", w.calories ? `${fmt(w.calories)} kcal` : "", w.water_temp_c ? `water ${fmt(w.water_temp_c, 1)} °C` : "", m.avg_temp_c ? `${fmt(m.avg_temp_c, 1)} °C` : ""].filter(Boolean).join(" · ");
    const planned = Array.isArray(x.planned_session) ? x.planned_session : [];
    const plannedHtml = planned.length ? planned.map((p) => `<div class="item ${planIntensity(p)}"><div class="title">${sportTag(p.sport)}${esc(p.title)}</div><div class="sub">${esc(sessionBits(p))}</div>${p.targets ? `<div class="targets">${esc(p.targets)}</div>` : ""}</div>`).join("") : '<div class="empty">Nothing was planned that day.</div>';
    const S = x.series || {}, t = S.t_min || [];
    const pts = (arr) => (arr || []).map((v, i) => [t[i], v]);
    // Stops and walk breaks show up as very slow pace: drop what is far slower than the session's median.
    const clip = (arr) => { const v = (arr || []).filter(has).sort((a, b) => a - b), med = v[Math.floor(v.length / 2)]; return arr && arr.map((x) => has(x) && x <= med * 1.5 ? x : null); };
    const tfmt = (v) => `${Math.floor(v)}:${pad(Math.round((v % 1) * 60))}`;
    const charts = [];
    const chart = (key, label, arr, opts) => { if (!arr || !arr.some(has)) return; charts.push(`<div class="chart-label">${esc(label)}</div><div class="chart" id="ss-${key}"></div>`);
      mount(`ss-${key}`, (c) => xyChart(c, { x: "linear", height: 120, xfmt: (v) => `${fmt(v)}′`, tipTitle: (p) => `${tfmt(p[0])} min`, ...opts, series: [{ points: pts(arr), color: opts.color || "var(--series-1)", label, width: 1.5, tfmt: opts.yfmt }] })); };
    const lthr = sp === "run" ? th.lthr_run : th.lthr_bike;
    chart("power", "Power (W, 10 s average)", S.power, { refs: th.ftp ? [{ y: th.ftp, label: `FTP ${fmt(th.ftp)}` }] : [], zero: true });
    chart("hr", "Heart rate (bpm)", S.hr, { refs: lthr ? [{ y: lthr, label: `LTHR ${fmt(lthr)}` }] : [], color: "var(--series-2)" });
    chart("pace", "Pace (per km, stops left out)", clip(S.pace_s_km), { invert: true, yfmt: paceFmt, refs: th.run_threshold_s_km ? [{ y: th.run_threshold_s_km, label: `threshold ${pace(th.run_threshold_s_km)}` }] : [] });
    chart("pace100", "Pace (per 100 m)", clip(S.pace_s_100m), { invert: true, yfmt: paceFmt });
    chart("speed", "Speed (km/h)", S.kmh, { yfmt: (v) => fmt(v, 1) });
    chart("alt", "Altitude (m)", S.altitude, {});
    chart("cad", sp === "run" ? "Cadence (spm)" : "Cadence", S.cadence, {});
    const zs = x.zones_s || {};
    const zrows = (z) => { const tot = Object.values(z || {}).reduce((a, v) => a + v, 0) || 1; return Object.entries(z || {}).map(([k, v]) => ({ zone: k, h: v / 3600, pct: (100 * v) / tot })); };
    const laps = x.laps || [];
    const lapCols = [["lap", "Lap"], ["km", "km"], ["time_s", "Time"], ["pace_s_km", "Pace"], ["gap_s_km", "GAP"], ["pace_s_100m", "/100m"], ["kmh", "km/h"], ["avg_power", "W"], ["np", "NP"], ["pct_ftp", "% FTP"], ["pct_threshold_pace", "% thr"], ["avg_hr", "HR"], ["max_hr", "Max HR"], ["cadence", "Cad"], ["ascent_m", "Up m"]]
      .filter(([k]) => laps.some((l) => has(l[k])));
    const lapVal = (k, v) => !has(v) ? "–" : ["pace_s_km", "gap_s_km", "pace_s_100m"].includes(k) ? pace(v) : k === "time_s" ? tfmt(v / 60) : fmt(v, k === "km" ? 2 : k === "kmh" ? 1 : 0);
    const lapTable = laps.length > 1 ? `<section class="card"><h2>Laps <span class="muted">${laps.length}</span></h2><div class="scroll"><table><thead><tr>${lapCols.map(([, l]) => `<th class="num">${esc(l)}</th>`).join("")}</tr></thead><tbody>
      ${laps.map((l) => `<tr>${lapCols.map(([k]) => `<td class="num">${esc(lapVal(k, l[k]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>` : "";
    const iv = x.intervals;
    const ivTable = iv && iv.reps?.length ? `<section class="card"><h2>Work intervals <span class="muted">${iv.count} found · ${esc(iv.basis || "")}${iv.band_w ? ` · band ${fmt(iv.band_w[0])}–${iv.band_w[1] ? fmt(iv.band_w[1]) : "∞"} W` : ""}</span></h2><div class="scroll"><table><thead><tr><th class="num">#</th><th class="num">Start</th><th class="num">Duration</th><th class="num">Avg W</th><th class="num">NP</th><th class="num">% FTP</th><th class="num">HR</th><th class="num">HR drift</th></tr></thead><tbody>
      ${iv.reps.map((r, i) => `<tr><td class="num">${i + 1}</td><td class="num">${fmt(r.start_min, 1)}′</td><td class="num">${esc(r.duration)}</td><td class="num">${fmt(r.avg_power)}</td><td class="num">${fmt(r.np)}</td><td class="num">${fmt(r.pct_ftp)}</td><td class="num">${fmt(r.avg_hr)}</td><td class="num">${has(r.pw_hr_drift_pct) ? fmt(r.pw_hr_drift_pct, 1) + "%" : "–"}</td></tr>`).join("")}</tbody></table></div>${has(iv.fade_pct) ? `<div class="sub">Last rep vs first: ${iv.fade_pct > 0 ? "+" : ""}${fmt(iv.fade_pct, 1)}% power${has(iv.hr_rise_bpm) ? `, ${iv.hr_rise_bpm > 0 ? "+" : ""}${fmt(iv.hr_rise_bpm)} bpm HR` : ""}.</div>` : ""}</section>` : "";
    const bests = (m.best_efforts || []).length ? `<section class="card"><h2>Best efforts</h2><div class="scroll"><table><thead><tr><th>Duration</th><th class="num">W</th><th class="num">W/kg</th><th class="num">90-day best before</th><th></th></tr></thead><tbody>
      ${m.best_efforts.map((b) => `<tr><td>${esc(b.duration)}</td><td class="num">${fmt(b.watts)}</td><td class="num">${has(b.w_kg) ? fmt(b.w_kg, 2) : "–"}</td><td class="num">${fmt(b.prior_90d_best)}</td><td>${b.new_90d_best ? '<span class="badge"><span class="dot" style="background:var(--good)"></span>✓ new 90-day best</span>' : ""}</td></tr>`).join("")}</tbody></table></div></section>` : "";
    const form = x.form_going_in || {};
    const day = x.date, inPlan = !!dayOf(day);
    const rv = x.coach_review;
    const review = rv ? `<section class="card"><h2>Coach review <span class="muted">${rv.origin === "auto" ? "automatic" : "from a chat"} · ${esc(String(rv.updated_at || "").slice(0, 16).replace("T", " "))}</span></h2>${richText(rv.text)}</section>` : "";
    const garmin = DATA.app.provider === "garmin" ? ` · <a href="https://connect.garmin.com/modern/activity/${encodeURIComponent(o.id)}" target="_blank" rel="noopener">Garmin Connect ↗</a>` : "";
    return `${crumbs([[cycling() ? "Rides" : "Sessions", "sessions"], [o.name || o.type || "Session"]])}
      ${pager(nb.prev && ["Previous", `session/${nb.prev}`], nb.next && ["Next", `session/${nb.next}`])}
      <section class="card"><div class="kicker">${sportTag(sp)}<span>${esc(dlong(day))} · ${esc((o.start || "").slice(11, 16))}</span>${o.type ? `<span>· ${esc(typeName(o.type))}</span>` : ""}${inPlan ? `<a href="#plan/day/${day}">plan day ›</a>` : ""}${garmin}</div>

const FUEL_DAY = {
  race: ["Race day", "var(--int-hard)"], carb_load: ["Carb load", "var(--int-hard)"], fuel_up: ["Fuel up", "var(--int-moderate)"],
  normal: ["Maintenance", "var(--int-easy)"], deficit_ok: ["Deficit OK", "var(--muted)"],
};
const range = (r, unit = "") => r ? (r[0] === r[1] ? `${fmt(r[0])}${unit}` : `${fmt(r[0])}–${fmt(r[1])}${unit}`) : "–";
const signed = (v, d = 1) => has(v) ? `${v > 0 ? "+" : v < 0 ? "−" : ""}${fmt(Math.abs(v), d)}` : "–";
const mmss = (s) => { if (!has(s)) return "–"; const r = Math.round(s), h = Math.floor(r / 3600), m = Math.floor(r % 3600 / 60); return h ? `${h}:${pad(m)}:${pad(r % 60)}` : `${m}:${pad(r % 60)}`; };
const sessFuel = (f) => f.carbs_g_h[1] ? `${range(f.carbs_g_h)} g/h carbs${f.carbs_total_g ? ` (${range(f.carbs_total_g)} g)` : ""}${f.fluid_ml_h ? ` · ${range(f.fluid_ml_h)} ml/h` : ""}${f.sodium_mg_h ? ` · ${range(f.sodium_mg_h)} mg sodium/h` : ""}`
  : f.fluid_ml_h ? `water is enough · ${range(f.fluid_ml_h)} ml/h` : "water is enough";

// Steady climbing speed (m/s): same model as nutrition.py (gravity, rolling resistance, air, drivetrain loss).
function climbSpeed(power, mass, grade, ph) {
  const th = Math.atan(grade), wheel = power * ph.drivetrain;
  const need = (v) => mass * 9.81 * v * (Math.sin(th) + ph.crr * Math.cos(th)) + 0.5 * ph.rho * ph.cda * v ** 3;
  let lo = 0.1, hi = 30;
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (need(mid) < wheel) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}

function fuelTodayLine(f) {
  if (!f) return "";
  const k = FUEL_DAY[f.kind] || FUEL_DAY.normal;
  const sess = (f.sessions || []).filter((s) => s.carbs_g_h[1]).map((s) => `${SPORT[s.sport] || s.sport}: ${range(s.carbs_g_h)} g/h`).join(" · ");

    <span>Carbs <b>${range(f.carbs_g)} g</b> <span class="muted">(${range(f.carbs_g_kg)} g/kg)</span> · protein <b>${range(f.protein_g)} g</b>${sess ? ` · ${esc(sess)}` : ""}</span>

function carbLadder(x) {
  const lo = x.carbs_g_kg[0], hi = x.carbs_g_kg[1], c = { rest: "easy", light: "easy", moderate: "moderate", high: "hard" }[x.load] || "easy";
  return `<span class="ladder" role="img" aria-label="${lo} to ${hi} g carbs per kg"><span style="left:${lo / 12 * 100}%;width:${(hi - lo) / 12 * 100}%;background:var(--int-${c})"></span></span>`;
}

      <div class="scroll"><table><thead><tr><th>Race</th><th class="num">Time</th><th class="num">Carbs g/h</th><th class="num">Total</th><th class="num">Fluid</th><th class="num">Carb load</th></tr></thead><tbody>${raceRows}</tbody></table></div>
      ${noFuelPlan.length ? `<div class="sub" style="margin-top:6px">No fueling schedule in the race plan of ${esc(noFuelPlan.map((e) => shortName(e.name, 36)).join(", "))} yet: ask the coach.</div>` : ""}
      ${help("Start eating in the first 20–30 min and keep to a schedule (e.g. every 20 min), not hunger. Races under an hour: a carb mouth rinse or one gel 10–15 min before the start is enough. Breakfast 1–3 g/kg carbs 3 h before. Carb loading adds ~1–2 kg of glycogen and water on the scale: fuel, not fat. 80–120 g/h only with a trained gut: build up over 6–8 weeks of long rides with your race products. A race shows no time until it has a distance and climbing (or an expected time).")}</section>` : "";
    const climbRows = n.climbs.map((c, i) => `<tr><td><b>${esc(c.name)}</b>${c.event && !c.from_event ? `<div class="muted">${esc(shortName(c.event))}</div>` : ""}</td><td class="num">${fmt(c.length_km, 1)} km · ${fmt(c.grade_pct, 1)}%</td>
      <td class="num">${fmt(c.power_w)} W<div class="muted">${esc(c.power_basis)}</div></td><td class="num">${mmss(c.time_s)}</td><td class="num">${has(c.time_at_target_s) ? `${mmss(c.time_at_target_s)}<div class="muted">−${mmss(c.saved_s)} · or +${fmt(c.equivalent_w)} W</div>` : "–"}</td>
      <td class="num">${fmt(c.per_kg_s)} s</td><td class="num"><button class="btn link" data-climb="${i}">Calculator</button></td></tr>`).join("");
    const ph = n.physics, c0 = n.climbs[0];
    const climbCard = `<section class="card"><h2>What a kilo is worth on the climbs <span class="muted">power vs weight</span></h2>
      ${climbRows ? `<div class="scroll"><table><thead><tr><th>Climb</th><th class="num">Length</th><th class="num">Power</th><th class="num">Now (${fmt(kg, 1)} kg)</th><th class="num">At target${n.profile.target_weight_kg ? ` (${fmt(n.profile.target_weight_kg, 1)} kg)` : ""}</th><th class="num">Per kg</th><th></th></tr></thead><tbody>${climbRows}</tbody></table></div>`
        : '<div class="empty">No key climbs saved. Ask the coach to save the climbs of your mountain events (length, climbing, event).</div>'}
      <details class="calc-box"><summary>Climb calculator: try your own length, power and weight</summary>
      <div class="calc" id="nu-calc" data-ph='${esc(JSON.stringify(ph))}'>
        <label>Length km<input type="number" id="cc-km" step="0.1" min="0.5" value="${c0 ? c0.length_km : 10}"></label>
        <label>Climbing m<input type="number" id="cc-m" step="10" min="0" value="${c0 ? c0.gain_m : 700}"></label>
        <label>Power W<input type="number" id="cc-w" step="5" min="50" value="${c0 ? c0.power_w : Math.round((n.ftp || 250) * 0.9)}"></label>
        <label>Rider kg<input type="number" id="cc-kg" step="0.5" min="30" value="${fmt(kg || 75, 1)}"></label>
        <label>Bike + kit kg<input type="number" id="cc-bike" step="0.5" min="4" value="${ph.bike_kg}"></label></div>
      <div id="cc-out" class="calc-out"></div></details>
      ${help(`Steady power, no wind, CdA ${ph.cda} m², Crr ${ph.crr}. On a 7% climb about 90% of your power lifts mass, so 1 kg less is worth roughly your power ÷ system mass in watts. Losing weight only pays if the power stays: a deficit on key days costs more watts than it saves kilos.`)}</section>`;

    const longRows = n.energy.long_sessions.map((s) => `<tr><td style="white-space:nowrap">${esc(dshort(s.date))}</td><td>${sportTag(s.sport)}<a href="${sessionHref(s.id)}">${esc(s.name || "")}</a></td><td class="num">${fmt(s.hours, 1)} h</td>
      <td class="num">${fmt(s.kcal)}<div class="muted">${s.kcal_source === "power" ? "from power" : "watch"}</div></td><td class="num">${fmt(s.if, 2)}</td><td class="num">${fmt(s.carbs_burned_g_h)}</td><td class="num">${fmt(s.advised_g_h)}</td>
      <td class="num">${has(s.decoupling_pct) ? `${s.fueling_flag ? '<span title="drift over 8%">! </span>' : ""}${fmt(s.decoupling_pct, 1)}%` : "–"}</td></tr>`).join("");
    const bmrNote = n.energy.bmr_kcal ? `Resting ≈ ${fmt(n.energy.bmr_kcal)} kcal/day (${esc(n.energy.bmr_basis)}), daily life ×${n.energy.daily_life_factor}.` : "";
    const energyCard = `<section class="card"><h2>Energy spent in training <span class="muted">kcal per day, by week</span></h2>
      <div class="chart" id="nu-energy"></div>
      ${help(`${bmrNote} Bike work from power (1 kJ ≈ 1 kcal burned), other sessions from the watch. Watches overestimate; treat it as a ratio between weeks, not a menu.`)}
      <div class="section-label">Long sessions (2 h+), last 8 weeks</div>
      ${longRows ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Session</th><th class="num">Time</th><th class="num">kcal</th><th class="num">IF</th><th class="num">Carbs burned g/h</th><th class="num">Advised intake g/h</th><th class="num">Drift</th></tr></thead><tbody>${longRows}</tbody></table></div>
        ${help("Carbs burned estimated from kcal and intensity. You can't replace all of it during the ride; aim for the advised intake and make up the rest after. Drift over 8% late in a long ride often means under-fueling.")}` : '<div class="empty">No sessions over 2 h in the last 8 weeks.</div>'}</section>`;

    const basics = `<section class="card"><details><summary>Ground rules</summary><ul class="flags" style="margin-top:8px">
      <li>Lose at most ~0.5% of body weight per week (≈${fmt(w.safe_loss_kg_week, 2)} kg for you), from small deficits on easy and rest days. Never cut on key-session days or the day before.</li>
      <li>Stop the deficit 3 weeks before an A event and race at a stable weight. Off-season and base are the time to lose; build and peak are for fueling.</li>
      <li>Protein ${n.losing ? "2.0–2.4" : "1.6–2.2"} g/kg per day, spread over 4 meals; 0.3–0.4 g/kg after hard sessions and before sleep.</li>
      <li>During rides: nothing needed under 60 min, 30–60 g/h up to 90 min, 60–90 g/h beyond, 80–120 g/h in races if trained. 500–750 ml fluid and 300–600 mg sodium per hour.</li>
      <li>Under-fueling shows as heavy legs, late-ride fade, poor sleep, low mood, frequent colds or a dropping HRV. Together with weight loss, ${{ f: "missed or irregular periods", m: "low libido" }[n.profile.sex] || "missed periods or low libido"} or bone pain, it can be low energy availability (RED-S): see a sports physician or dietitian.</li>
      </ul></details></section>`;

    return `${head}<div class="grid two">${weightCard}${strategy}</div>${daysCard}${climbCard}${racesCard}${moreSections("More: training energy, long rides, ground rules", energyCard + basics)}`;
  });
}

function bindNutrition() {
  const msg = document.getElementById("nu-msg");
  const refresh = () => { const v = VIEWS["/api/view/nutrition"]; if (v) v.stale = true; load(); };
  document.getElementById("nu-save")?.addEventListener("click", async () => {
    const kg = document.getElementById("nu-kg").value;
    if (!kg) { msg.textContent = "Enter your weight in kg."; msg.className = "msg err"; return; }
    msg.textContent = "Saving…"; msg.className = "msg";
    try {
      await api("/api/weight", { date: document.getElementById("nu-date").value, weight_kg: Number(kg), note: document.getElementById("nu-note").value });
      refresh();
    } catch (e) { msg.textContent = e.message; msg.className = "msg err"; }
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    try { await api("/api/weight/delete", { date: b.dataset.del }); refresh(); } catch (e) { msg.textContent = e.message; msg.className = "msg err"; }
  }));
  const calc = document.getElementById("nu-calc");
  if (!calc) return;
  const ph = JSON.parse(calc.dataset.ph), v = (id) => Number(document.getElementById(id).value);
  const update = () => {
    const km = v("cc-km"), m = v("cc-m"), w = v("cc-w"), kg = v("cc-kg"), bike = v("cc-bike"), out = document.getElementById("cc-out");
    if (!(km > 0 && w > 0 && kg > 0)) { out.innerHTML = ""; return; }
    const grade = m / (km * 1000), t = (mass) => km * 1000 / climbSpeed(w, mass, grade, ph);
    const now = t(kg + bike), less = (d) => now - t(kg - d + bike);
    out.innerHTML = `<div class="stats">${statBox(mmss(now), `${fmt(grade * 100, 1)}% · ${fmt(km * 3600 / now, 1)} km/h`)}${statBox(`${fmt(w / kg, 2)}<small>W/kg</small>`, `VAM ${fmt(m / now * 3600)} m/h`)}
      ${statBox(`−${fmt(less(1))}<small>s</small>`, "1 kg lighter")}${statBox(`−${fmt(less(3))}<small>s</small>`, "3 kg lighter")}${statBox(`−${fmt(now - km * 1000 / climbSpeed(w + 10, kg + bike, grade, ph))}<small>s</small>`, "10 W more")}</div>`;
  };
  calc.querySelectorAll("input").forEach((i) => i.addEventListener("input", update));
  document.querySelectorAll("[data-climb]").forEach((b) => b.addEventListener("click", () => {
    const c = VIEWS["/api/view/nutrition"].data.climbs[Number(b.dataset.climb)];
    document.getElementById("cc-km").value = c.length_km; document.getElementById("cc-m").value = c.gain_m; document.getElementById("cc-w").value = c.power_w;
    calc.closest("details").open = true;
    update(); calc.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }));
  update();
}

// ---------------------------------------------------------------- Settings
let SET = null, SET_MSG = { text: "", bad: false }, CONFIRM = null, pollTimer = null;

function sourceBanner(d) {
  if (!d.app.provider) return `<section class="card banner"><h2>Connect your watch</h2><div>No data source yet. Open <a href="#settings">Settings</a> to add a Garmin Personal API key or connect COROS.</div></section>`;
  if (d.sync_error) return `<section class="card banner bad"><h2>${esc(watch())} sync failing</h2><div>${esc(d.sync_error)}</div><div class="muted"><a href="#settings">Settings ›</a></div></section>`;
  return "";
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? { cache: "no-store" }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (data.app) SET = data;
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function act(path, body, okText) {
  SET_MSG = { text: "Working…", bad: false };
  renderSettings();
  try {
    const out = await api(path, body);
    SET_MSG = { text: okText || "", bad: false };
    if (out.url) window.open(out.url, "_blank", "noopener");
    if (SET.sync_job?.running) watchSync();
    await load();
  } catch (e) {
    SET_MSG = { text: e.message, bad: true };
  }
  renderSettings();
}

function watchSync() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try { await api("/api/settings"); } catch (e) { /* keep polling */ }
    if (!SET.sync_job?.running) { clearInterval(pollTimer); await load(); }
    renderSettings();
  }, 3000);
}

function viewSettings() {
  if (!SET) { api("/api/settings").then(() => { if (SET.sync_job?.running) watchSync(); renderSettings(); }).catch((e) => { SET_MSG = { text: e.message, bad: true }; renderSettings(); }); }
  return '<div id="settings"><section class="card"><div class="empty">Loading settings…</div></section></div>';
}

function renderSettings() {
  const el = document.getElementById("settings");
  if (!el || !SET) return;
  const active = SET.app.provider, job = SET.sync_job || {};
  const conn = { garmin: !!SET.garmin.connected, coros: !!SET.coros.logged_in };
  const state = (p) => conn[p] ? `<span class="state on">${p === active ? "Connected · in use" : "Connected"}</span>`
    : `<span class="state${p === active ? " err" : ""}">${p === active ? "Selected · not connected" : "Not connected"}</span>`;
  const useBtn = (p) => conn[p] && p !== active ? `<button class="btn" data-use="${p}">Use ${esc(SET.providers[p])} instead</button>` : "";
  const garmin = `<div class="option ${active === "garmin" ? "active" : ""}"><h3>Garmin ${state("garmin")}</h3>
    ${conn.garmin ? `<p>Using ${esc(SET.garmin.key)}. Paste a new key below to replace it.</p>` : "<p>Uses Garmin's official Personal API (read-only). Create a key in your Garmin account's API settings and paste it here.</p>"}
    <div class="field"><input id="garmin-key" type="password" autocomplete="off" placeholder="Personal API key" aria-label="Garmin Personal API key">
      <button class="btn primary" data-act="garmin-key">Save &amp; test</button></div>
    <div class="row" style="margin-top:6px">${useBtn("garmin")}${conn.garmin ? '<button class="btn link" data-act="garmin-forget">Remove key</button>' : ""}</div></div>`;
  const corosSteps = `<ol class="steps"><li>Click <b>Log in to COROS</b>: the COROS login opens in a new tab.</li>
      <li>After you allow access, that tab ends on a page that does not load (an address starting with <code>http://127.0.0.1:8765/callback</code>). That is expected.</li>
      <li>Copy the whole address from that tab and paste it here.</li></ol>`;
  const coros = `<div class="option ${active === "coros" ? "active" : ""}"><h3>COROS ${state("coros")}</h3>
    ${conn.coros ? `<p>Logged in; access renews by itself (current token until ${esc(SET.coros.access_token_expires)}). Log in again only if syncing stops.</p>` : "<p>Uses the official COROS connector (the same one Claude.ai offers). Can also put run and bike workouts on your COROS calendar.</p>"}
    ${corosSteps}
    <div class="row"><button class="btn ${conn.coros ? "" : "primary"}" data-act="coros-start">Log in to COROS</button></div>
    <div class="field"><input id="coros-callback" type="text" autocomplete="off" placeholder="http://127.0.0.1:8765/callback?code=…" aria-label="Address after COROS login">
      <button class="btn primary" data-act="coros-finish">Finish</button></div>
    <div class="row" style="margin-top:6px">${useBtn("coros")}${conn.coros ? '<button class="btn link" data-act="coros-logout">Log out</button>' : ""}</div></div>`;
  const confirm = CONFIRM ? `<section class="card banner"><h2>Switch to ${esc(SET.providers[CONFIRM])}?</h2>
    <div>Activities and health data from ${esc(SET.providers[active])} are cleared and everything is synced fresh from ${esc(SET.providers[CONFIRM])}${CONFIRM === "coros" ? " (FIT files arrive over a few days: COROS allows about 50 per day)" : ""}. Your plan, profile, thresholds and coach note stay.</div>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-confirm="yes">Switch</button><button class="btn" data-confirm="no">Cancel</button></div></section>` : "";
  const syncLine = job.running ? "Syncing now…"
    : job.finished ? (job.ok ? `Last sync from here: ${job.summary}` : `Last sync from here failed: ${job.error}`) : "";
  const focus = SET.app.focus;
  el.innerHTML = `${confirm}
    <section class="card"><h2>Data source <span class="muted">where activities, sleep and HRV come from</span></h2>
      <div class="choice">${garmin}${coros}</div>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="sync" ${!active || job.running ? "disabled" : ""}>Sync now</button>
        <span class="muted">${active ? `Last sync ${esc(SET.last_sync ? SET.last_sync.replace("T", " ") : "never")}` : "Connect a source to start syncing."}${SET.sync_error ? ` · <span class="err">${esc(SET.sync_error)}</span>` : ""}</span></div>
      ${syncLine ? `<div class="msg ${job.ok === false ? "err" : "muted"}">${esc(syncLine)}</div>` : ""}
      ${SET_MSG.text ? `<div class="msg ${SET_MSG.bad ? "err" : ""}">${esc(SET_MSG.text)}</div>` : ""}</section>
    <section class="card"><h2>Training focus <span class="muted">what the coach plans and reviews for</span></h2>
      <div class="seg" role="group" aria-label="Training focus">${Object.entries(SET.focuses).map(([k, label]) => `<button data-focus="${k}" aria-pressed="${k === focus}">${esc(label)}</button>`).join("")}</div>
      <p class="muted" style="margin-bottom:0">${focus === "road_cycling" ? "Bike-first coaching: power, FTP and ride structure. Other sports still count toward load." : "Swim, bike and run: per-sport thresholds (FTP, run threshold pace, CSS), bricks and race-format planning."}
        Takes effect in the next Claude conversation.</p></section>`;
  el.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a === "garmin-key") act("/api/garmin/key", { key: document.getElementById("garmin-key").value }, "Garmin accepted the key. Syncing…");
    else if (a === "garmin-forget") act("/api/garmin/forget", {}, "Key removed.");
    else if (a === "coros-start") act("/api/coros/start", {}, "COROS login opened in a new tab. Paste the address you end up on below.");
    else if (a === "coros-finish") act("/api/coros/finish", { callback: document.getElementById("coros-callback").value }, "COROS connected. Syncing…");
    else if (a === "coros-logout") act("/api/coros/logout", {}, "Logged out of COROS.");
    else if (a === "sync") act("/api/sync", {}, "");
  }));
  el.querySelectorAll("[data-use]").forEach((b) => b.addEventListener("click", () => { CONFIRM = b.dataset.use; renderSettings(); window.scrollTo(0, 0); }));
  el.querySelectorAll("[data-confirm]").forEach((b) => b.addEventListener("click", () => {
    const p = CONFIRM; CONFIRM = null;
    if (b.dataset.confirm === "yes") act("/api/settings/source", { provider: p }, `Switched to ${SET.providers[p]}. Syncing…`); else renderSettings();
  }));
  el.querySelectorAll("[data-focus]").forEach((b) => b.addEventListener("click", () => act("/api/settings/focus", { focus: b.dataset.focus }, "Focus saved.")));
}

// ---------------------------------------------------------------- routing
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  return TABS().some((t) => t[0] === parts[0]) || (parts[0] === "session" && /^\d+$/.test(parts[1] || "")) ? parts : ["today"];
}

function render() {
  const d = DATA, parts = route(), tab = parts[0];
  document.title = d.app.title;
  document.getElementById("title").textContent = d.app.title;
  const active = tab === "session" ? "sessions" : tab, labels = Object.fromEntries(TABS());
  const section = SECTIONS.find((s) => s[2].includes(active)) || SECTIONS[0];
  lastPage[section[0]] = active;
  document.getElementById("tabs").innerHTML = SECTIONS.map(([k, label, pages]) => k === "settings"
    ? `<a href="#settings" class="gear${k === section[0] ? " on" : ""}" title="Settings" aria-label="Settings"${k === section[0] ? ' aria-current="page"' : ""}>⚙</a>`
    : `<a href="#${lastPage[k] || pages[0]}"${k === section[0] ? ' class="on" aria-current="true"' : ""}>${label}</a>`).join("");
  document.getElementById("subtabs").innerHTML = section[2].length > 1
    ? section[2].map((k) => `<a href="#${k}"${k === active ? ' aria-current="page"' : ""}>${esc(labels[k])}</a>`).join("") : "";
  POST = [];
  hideTip();
  let html;
  if (tab === "plan" && parts[1] === "block") html = viewBlock(d, parts[2]);
  else if (tab === "plan" && parts[1] === "week") html = viewWeek(d, parts[2]);
  else if (tab === "plan" && parts[1] === "day") html = viewDay(d, parts[2]);
  else if (tab === "session") html = viewSession(d, parts[1]);
  else if (tab === "sports") html = viewSport(d, parts[1]);
  else html = { today: viewToday, plan: viewPlan, races: viewRaces, progress: viewProgress, recovery: viewRecovery, health: viewHealth, sleep: viewSleep, nutrition: viewNutrition, load: viewLoad, sessions: viewSessions, settings: viewSettings }[tab](d);
  document.getElementById("app").innerHTML = html;
  POST.forEach((f) => f());
  if (tab === "settings") renderSettings();
  if (location.hash !== lastHash) { if (lastHash !== null) window.scrollTo(0, 0); lastHash = location.hash; }
  const synced = d.last_sync ? d.last_sync.replace("T", " ") : "never";
  document.getElementById("meta").textContent = `${d.app.provider ? watch() + " sync " + synced : "No data source"} · page ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
}

let sugTimer = null;
async function load() {
  try {
    const res = await fetch("/api/dashboard", { cache: "no-store" });
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    DATA = await res.json();
    Object.values(VIEWS).forEach((v) => { v.stale = true; });
    clearTimeout(sugTimer);
    if ((DATA.suggestions || []).some((s) => ["accepted", "applying"].includes(s.status))) sugTimer = setTimeout(load, 5000);
    // Don't wipe a half-typed key, login address or weigh-in.
    if (["settings", "nutrition"].includes(route()[0]) && document.activeElement?.tagName === "INPUT") return;
    render();
  } catch (e) {
    document.getElementById("meta").innerHTML = `<span class="err">Could not load data: ${esc(e.message)}</span>`;
  }
}
window.addEventListener("hashchange", () => DATA && render());
let rt, lastW = window.innerWidth;
window.addEventListener("resize", () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rt); rt = setTimeout(() => DATA && render(), 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, 5 * 60 * 1000);
load();
</script>
