  return `${sourceBanner(d)}<div class="grid two">${todayCard(d)}${comingUpCard(d)}</div>
    ${suggestionsCard(d.suggestions || [])}
    ${checkinCard(d)}
    <div class="grid two"><section class="card"><h2>Health · last 30 days <a href="#health">Trends ›</a></h2>${healthTiles(d, "spk-t")}</section>
    <section class="card"><h2>Training load <a href="#load">Details ›</a></h2>${loadStats(d)}
      <div class="legend"><span class="key"><span class="line" style="background:var(--series-1)"></span>Fitness (CTL)</span><span class="key"><span class="line" style="background:var(--series-2)"></span>Fatigue (ATL)</span></div>
      <div class="chart" id="pmc-mini"></div></section></div>`;
}

// ---------------------------------------------------------------- Plan: overview
function timeline(blocks, weeks) {
  if (!blocks.length) return "";
  const start = pd(weeks[0].week_of), span = weeks.length * 7 * DAY_MS;
  const pos = (key) => Math.min(100, Math.max(0, ((pd(key) - start) / span) * 100));
  const lanes = [];
  for (const b of [...blocks].sort((a, c) => a.start_date.localeCompare(c.start_date))) {
    let lane = lanes.find((l) => l[l.length - 1].end_date < b.start_date);
    if (!lane) lanes.push(lane = []);
    lane.push(b);
  }
  const cur = blockOfDay(todayKey());
  const html = lanes.map((l) => `<div class="tl-lane">${l.map((b) => {
    const left = pos(b.start_date), right = pos(addDays(b.end_date, 1));
    return `<a class="tl-block ${cur && cur.id === b.id ? "current" : ""}" href="#plan/block/${b.id}" style="left:${left}%;width:calc(${right - left}% - 2px)" title="${esc(`${b.name} · ${dshort(b.start_date)} – ${dshort(b.end_date)}`)}"><b>${esc(b.name)}</b><span>${esc(b.phase || "")}</span></a>`;
  }).join("")}</div>`).join("");
  const marks = `<div class="tl-mark" style="left:${pos(todayKey()) + (0.5 / 7 / weeks.length) * 100}%" title="Today"></div>` +
    (DATA.events || []).filter((e) => e.date <= addDays(weeks[weeks.length - 1].week_of, 6)).map((e) => `<div class="tl-mark event" style="left:${pos(e.date) + (0.5 / 7 / weeks.length) * 100}%" title="${esc(e.name)}"></div>`).join("");
  return `<div class="timeline">${html}${marks}</div>`;
}

function viewPlan(d) {
  const p = d.plan;
  if (!p.has_sessions) return `<section class="card"><h2>Training plan</h2><div class="empty">No plan saved yet. Ask the coach for one with /training-plan, and it shows up here: blocks, weeks and every workout.</div></section>`;
  const weeks = p.weeks, maxT = maxDayTss(weeks);
  const planned = weeks.filter((w) => w.planned_tss);
  const first = planned[0]?.week_of, last = planned[planned.length - 1]?.week_of;
  const future = weeks.filter((w) => !w.days[6].is_past);
  const totalH = future.reduce((a, w) => a + w.planned_h, 0), totalT = future.reduce((a, w) => a + w.planned_tss, 0);
  const done = weeks.filter((w) => w.completion_pct !== null && w.completion_pct !== undefined);
  const comp = done.length ? Math.round(mean(done.map((w) => w.completion_pct))) : null;
  const ev = (d.events || []).slice(1).map((e) => `<a class="pill" href="#races" title="${esc(e.name)}">${esc(shortName(e.name, 36))} · ${esc(dshort(e.date))} · ${e.days_to_go} d</a>`).join("");
  mount("plan-bars", (c) => weekBars(c, planWeekItems(weeks), { height: 150, aria: "Planned and done TSS per week" }));
  const blocks = [...p.blocks].sort((a, c) => a.start_date.localeCompare(c.start_date)).map((b) => {
    const bws = blockWeeks(b), cur = blockOfDay(todayKey())?.id === b.id;
    return `<a class="wk rowlink ${cur ? "current" : ""}" href="#plan/block/${b.id}" style="grid-template-columns:minmax(0,1fr) auto 14px;grid-template-areas:'t nums chev'">
      <span class="t"><b>${esc(b.name)}</b><span class="sub">${esc([b.phase, `${dshort(b.start_date)} – ${dshort(b.end_date)}`, b.goal].filter(Boolean).join(" · "))}</span></span>
      <span class="nums">${bws.length} wk · ${fmt(bws.reduce((a, w) => a + w.planned_h, 0), 0)} h<br><span class="muted">${fmt(bws.reduce((a, w) => a + w.planned_tss, 0))} TSS</span></span><span class="chev">›</span></a>`;
  }).join("");
  return `<section class="card"><div class="hero" style="margin-bottom:12px"><div>
      <h1 class="headline">Training plan</h1><div class="subhead">${esc(dshort(first))} to ${esc(dshort(addDays(last, 6)))}</div>
      ${ev ? `<div class="row" style="margin-top:10px">${ev}</div>` : ""}
      <div class="stats" style="margin-top:16px"><div><div class="value">${planned.length}</div><div class="label">Weeks planned</div></div>
        <div><div class="value">${fmt(totalH, 0)}<small>h</small></div><div class="label">Still to train</div></div>
        <div><div class="value">${fmt(totalT)}</div><div class="label">TSS still to go</div></div>
        <div><div class="value">${comp === null ? "–" : comp + "<small>%</small>"}</div><div class="label">Completion so far</div></div></div>
      </div>${borne(d)}</div>
      ${timeline(p.blocks, weeks)}
      <div class="chart" id="plan-bars"></div>${BAR_LEGEND}</section>
    ${blocks ? `<section class="card"><h2>Blocks</h2>${blocks}</section>` : ""}
    <section class="card"><h2>Weeks <span class="int-legend"><span style="--c:var(--int-easy)">Easy</span><span style="--c:var(--int-moderate)">Moderate</span><span style="--c:var(--int-hard)">Hard</span></span></h2>
      ${weeks.map((w) => weekRow(w, maxT)).join("")}</section>`;
}

// ---------------------------------------------------------------- Plan: block
function viewBlock(d, id) {
  const b = blockById(id);
  if (!b) return notFound("This block is not in the plan anymore.");
  const weeks = blockWeeks(b), maxT = maxDayTss(DATA.plan.weeks);
  const started = weeks.filter((w) => w.days[0].is_past || w.days[0].is_today);
  const isCur = b.start_date <= todayKey() && todayKey() <= b.end_date;
  const bw = isCur ? blockWeekNo(b, mondayOf(todayKey())) : null;
  const frac = Math.min(1, Math.max(0, (pd(todayKey()) - pd(b.start_date)) / (pd(b.end_date) - pd(b.start_date) + DAY_MS)));
  const sorted = [...DATA.plan.blocks].sort((a, c) => a.start_date.localeCompare(c.start_date)), i = sorted.findIndex((x) => x.id === b.id);
  mount("block-bars", (c) => weekBars(c, planWeekItems(weeks), { height: 140, aria: "Planned and done TSS per week in this block" }));
  return `${crumbs([["Plan", "plan"], [b.name]])}
    ${pager(sorted[i - 1] && [sorted[i - 1].name, `plan/block/${sorted[i - 1].id}`], sorted[i + 1] && [sorted[i + 1].name, `plan/block/${sorted[i + 1].id}`])}
    <section class="card">
      <div class="kicker">${b.phase ? `<span class="pill">${esc(typeName(b.phase))}</span>` : ""}<span>${esc(dshort(b.start_date))} – ${esc(dshort(b.end_date))}</span>${bw ? `<span>· week ${bw.n} of ${bw.total}</span>` : ""}</div>
      <h1 class="headline">${esc(b.name)}</h1>
      ${b.goal ? `<div class="subhead">${esc(b.goal)}</div>` : ""}
      <div class="meter"><div class="lbl"><span>Progress</span><span><b>${Math.round(frac * 100)}%</b></span></div><div class="track"><div class="fill" style="width:${frac * 100}%"></div></div></div>
      <div class="stats" style="margin-top:12px"><div><div class="value">${weeks.length}</div><div class="label">Weeks</div></div>
        <div><div class="value">${fmt(weeks.reduce((a, w) => a + w.planned_h, 0), 0)}<small>h</small></div><div class="label">Planned</div></div>
        <div><div class="value">${fmt(mean(weeks.map((w) => w.planned_tss)))}</div><div class="label">Avg TSS / week</div></div>
        <div><div class="value">${fmt(started.reduce((a, w) => a + w.actual_tss, 0))}<small>/ ${fmt(started.reduce((a, w) => a + w.planned_tss, 0))}</small></div><div class="label">TSS done so far</div></div></div>
      <div class="chart" id="block-bars"></div>${BAR_LEGEND}
      ${b.notes ? `<div class="section-label">Coach notes</div>${richText(b.notes)}` : ""}</section>
    <section class="card"><h2>Weeks in this block</h2>${weeks.map((w) => weekRow(w, maxT)).join("")}</section>`;
}

// ---------------------------------------------------------------- Plan: week
function viewWeek(d, key) {
  const w = weekOf(mondayOf(key));
  if (!w) return notFound("This week is outside the plan shown here.");
  const b = weekBlock(w), bw = b ? blockWeekNo(b, w.week_of) : null;
  const ws = DATA.plan.weeks, i = ws.indexOf(w);
  const started = w.days[0].is_past || w.days[0].is_today;
  const mins = { easy: 0, moderate: 0, hard: 0 };
  w.days.forEach((x) => activeSessions(x).forEach((s) => { mins[s.intensity] = (mins[s.intensity] || 0) + (s.duration_min || 0); }));
  const tot = mins.easy + mins.moderate + mins.hard;
  const keyDays = w.days.filter((x) => activeSessions(x).some((s) => s.intensity === "hard")).length;
  const split = tot ? `<div class="split" role="img" aria-label="Planned time by intensity">${["easy", "moderate", "hard"].filter((k) => mins[k]).map((k) => `<span style="--c:var(--int-${k});flex:${mins[k]}"></span>`).join("")}</div>
    <div class="int-legend">${["easy", "moderate", "hard"].map((k) => `<span style="--c:var(--int-${k})">${INTENSITY[k]} ${hm(mins[k]) || "0"} · ${Math.round((mins[k] / tot) * 100)}%</span>`).join("")}</div>` : "";
  const days = w.days.map((x) => `<a class="dayrow rowlink ${x.is_today ? "today" : ""} ${x.is_past ? "past" : ""}" href="#plan/day/${x.date}">
    <span class="when"><b>${wday(x.date)}</b>${esc(dshort(x.date))}</span>
    <span>${x.sessions.map(sessionLine).join("") || (x.actual.length ? "" : `<span class="sub">${x.is_past ? "—" : "No session planned"}</span>`)}${actualLine(x)}${x.status && x.status !== "pending" ? `<div style="margin-top:4px">${badge(x.status)}</div>` : ""}</span>
    <span class="chev">›</span></a>`).join("");
  const crumb = [["Plan", "plan"]];
  if (b) crumb.push([b.name, `plan/block/${b.id}`]);
  crumb.push([`Week of ${dshort(w.week_of)}`]);
  return `${crumbs(crumb)}
    ${pager(ws[i - 1] && [`Week of ${dshort(ws[i - 1].week_of)}`, `plan/week/${ws[i - 1].week_of}`], ws[i + 1] && [`Week of ${dshort(ws[i + 1].week_of)}`, `plan/week/${ws[i + 1].week_of}`])}
    <section class="card">
      <div class="kicker">${b ? `<a href="#plan/block/${b.id}">${esc(b.name)}</a>${bw ? ` · week ${bw.n} of ${bw.total}` : ""}` : "No block"}</div>
      <h1 class="headline">${esc(dshort(w.week_of))} – ${esc(dshort(addDays(w.week_of, 6)))}</h1>
      <div class="stats" style="margin-top:12px">
        <div><div class="value">${started ? `${fmt(w.actual_h, 1)}<small>/ ${fmt(w.planned_h, 1)} h</small>` : `${fmt(w.planned_h, 1)}<small>h</small>`}</div><div class="label">${started ? "Hours done / planned" : "Hours planned"}</div></div>
        <div><div class="value">${started ? `${fmt(w.actual_tss)}<small>/ ${fmt(w.planned_tss)}</small>` : fmt(w.planned_tss)}</div><div class="label">${started ? "TSS done / planned" : "TSS planned"}</div></div>
        <div><div class="value">${keyDays}</div><div class="label">Hard days</div></div>
        <div><div class="value">${w.completion_pct === null || w.completion_pct === undefined ? "–" : w.completion_pct + "<small>%</small>"}</div><div class="label">${w.days.some((x) => x.is_today) ? "Completion so far" : "Completion"}</div></div></div>
      ${split}</section>
    <section class="card"><h2>Days</h2>${days}</section>`;
}

// ---------------------------------------------------------------- Plan: day / workout
function sessionDetail(s) {
  const t = sessTss(s), h = (s.duration_min || 0) / 60;
  const estIf = t && h ? Math.sqrt(t / (h * 100)) : null;
  const ath = DATA.athlete, ftp = ath.ftp, thr = ath.run_threshold_s_km;
  // What the planned intensity means in this sport's own units.
  const est = s.sport === "bike" && estIf && ftp ? [fmt(estIf * ftp) + "<small>W</small>", `Est. NP (FTP ${fmt(ftp)} W)`]
    : s.sport === "run" && estIf && thr ? [pace(thr / estIf) + "<small>/km</small>", `Est. pace (threshold ${pace(thr)})`] : null;
  const orig = s.originally ? [s.originally.title, typeName(s.originally.type), hm(s.originally.duration_min), s.originally.tss ? `${fmt(s.originally.tss)} TSS` : ""].filter(Boolean).join(" · ") : "";
  return `<section class="card">
    <div class="kicker"><span class="pill"><span class="dot" style="background:var(--int-${s.intensity === "rest" ? "easy" : s.intensity})"></span>${esc(INTENSITY[s.intensity] || "Easy")}</span>${sportTag(s.sport)}<span>${esc(typeName(s.type))}</span>${s.slot > 1 ? "<span>· 2nd session</span>" : ""}${s.coros_ref ? "<span>· on the COROS calendar ✓</span>" : ""}</div>
    <h1 class="headline ${s.status === "skipped" ? "title skipped" : ""}">${esc(s.title)}</h1>
    ${s.type === "rest" ? "" : `<div class="stats" style="margin-top:12px">
      <div><div class="value">${hm(s.duration_min) || "–"}</div><div class="label">Duration</div></div>
      <div><div class="value">${t ? (s.tss ? "" : "~") + fmt(t) : "–"}</div><div class="label">${s.tss ? "TSS" : "TSS (estimated)"}</div></div>
      <div><div class="value">${estIf ? fmt(estIf, 2) : "–"}</div><div class="label">Intensity factor</div></div>
      ${est ? `<div><div class="value">${est[0]}</div><div class="label">${esc(est[1])}</div></div>` : ""}</div>`}
    ${["adjusted", "skipped", "added"].includes(s.status) ? `<div class="targets-box" style="font-weight:400;margin-top:8px">✎ <b>${esc(typeName(s.status))}</b>${s.change_reason ? `: ${esc(s.change_reason)}` : ""}${orig ? `<div class="sub" style="margin-top:4px">Originally: ${esc(orig)}</div>` : ""}</div>` : ""}
    ${s.purpose ? `<div class="section-label">Purpose</div><div>${esc(s.purpose)}</div>` : ""}
    ${s.targets ? `<div class="section-label">Targets</div><div class="targets-box ${s.intensity}">${esc(s.targets)}</div>` : ""}
    ${s.structure ? `<div class="section-label">Workout</div>${richText(s.structure)}` : (s.type !== "rest" ? '<div class="section-label">Workout</div><div class="empty">No detailed structure yet. The coach adds it in the week review before the week starts.</div>' : "")}
  </section>`;
}

const rideRow = (a) => `<div class="ride"><div class="row"><b>${sportTag(a.sport)}<a href="#session/${a.id}">${esc(a.name)}</a></b></div>
    <div class="sub">${esc([a.type, hm(a.minutes), a.km ? `${fmt(a.km, a.sport === "swim" ? 2 : 1)} km` : "", a.tss ? `TSS ${fmt(a.tss)}` : "", a.if ? `IF ${fmt(a.if, 2)}` : "", a.avg_hr ? `HR ${fmt(a.avg_hr)}` : ""].filter(Boolean).join(" · "))}</div></div>`;

// Planned vs done meters for a set of planned sessions and the activities that count toward them.
function doneMeters(ss, acts) {
  const pMin = ss.reduce((a, s) => a + (s.duration_min || 0), 0), pTss = ss.reduce((a, s) => a + (sessTss(s) || 0), 0);
  const aMin = acts.reduce((a, r) => a + (r.minutes || 0), 0), aTss = acts.reduce((a, r) => a + (r.tss || 0), 0);
  return meter("Duration (min)", Math.round(aMin), Math.round(pMin), "") + meter("TSS", Math.round(aTss), Math.round(pTss), "");
}

function actualCard(x) {
  const ss = activeSessions(x);
  // Several sessions planned: one section per session with the activities matched to it, then anything extra.
  if (ss.length > 1 && (x.actual.length || x.is_past)) {
    const parts = ss.map((s) => {
      const acts = x.actual.filter((a) => a.slot === s.slot);
      const res = s.result && s.result !== "pending" ? badge(s.result) : "";
      return `<div class="section-label">${sportTag(s.sport)}${esc(s.title)} ${res}</div>
        ${acts.length ? doneMeters([s], acts) + acts.map(rideRow).join("") : `<div class="empty">${x.is_past ? "Nothing recorded." : "Not done yet."}</div>`}`;
    }).join("");
    const extra = x.actual.filter((a) => !ss.some((s) => s.slot === a.slot));
    return `<section class="card"><h2>What you did ${x.status && x.status !== "pending" ? badge(x.status) : ""}</h2>${parts}
      ${extra.length ? `<div class="section-label">Not in the plan</div>${extra.map(rideRow).join("")}` : ""}</section>`;
  }
  if (!x.actual.length) return x.is_past && ss.length ? `<section class="card"><h2>What you did</h2><div class="empty">Nothing recorded.</div>${x.status ? `<div style="margin-top:6px">${badge(x.status)}</div>` : ""}</section>` : "";
  return `<section class="card"><h2>What you did ${x.status ? badge(x.status) : ""}</h2>
    ${ss.length ? doneMeters(ss, x.actual) : ""}${x.actual.map(rideRow).join("")}</section>`;
}

function zonesCard() {
  const ftp = DATA.athlete.ftp;
  if (!ftp) return "";
  const rows = ZONES.map(([n, lo, hi]) => `<tr><td>${esc(n)}</td><td class="num">${hi === null ? `> ${Math.round(lo * 100)}%` : `${Math.round(lo * 100)}–${Math.round(hi * 100)}%`}</td><td class="num">${hi === null ? `> ${Math.round(lo * ftp)}` : `${Math.round(lo * ftp)}–${Math.round(hi * ftp)}`} W</td></tr>`).join("");
  return `<section class="card"><details><summary>Power zones at FTP ${fmt(ftp)} W</summary><table style="margin-top:8px"><tbody>${rows}</tbody></table></details></section>`;
}

function viewDay(d, key) {
  const x = dayOf(key);
  if (!x) return notFound("This day is outside the plan shown here.");
  const w = weekOf(mondayOf(key)), b = blockOfDay(key);
  const prev = dayOf(addDays(key, -1)), next = dayOf(addDays(key, 1));
  const crumb = [["Plan", "plan"]];
  if (b) crumb.push([b.name, `plan/block/${b.id}`]);
  crumb.push([`Week of ${dshort(w.week_of)}`, `plan/week/${w.week_of}`], [`${wday(key)} ${dshort(key)}`]);
  const sessions = x.sessions.map(sessionDetail).join("") || `<section class="card"><div class="kicker">${esc(dlong(key))}</div><h1 class="headline">No session planned</h1><div class="subhead">A free day in the plan.</div></section>`;
  return `${crumbs(crumb)}
    ${pager(prev && [`${wday(prev.date)} ${dshort(prev.date)}`, `plan/day/${prev.date}`], next && [`${wday(next.date)} ${dshort(next.date)}`, `plan/day/${next.date}`])}
    <div class="kicker" style="margin:0 0 8px">${esc(dlong(key))}${x.is_today ? " · today" : ""}</div>
    ${sessions}${actualCard(x)}${x.sessions.some((s) => s.sport === "bike" || s.sport === "brick") ? zonesCard() : ""}`;
}

const notFound = (msg) => `${crumbs([["Plan", "plan"], ["Not found"]])}<section class="card"><div class="empty">${esc(msg)}</div></section>`;

// ---------------------------------------------------------------- Health
function viewHealth(d) {
  const r = d.readiness || {}, st = STATUS[r.status] || { label: "No data", color: "var(--muted)", icon: "?" };
  const flags = (r.flags || []).map((f) => `<li>${esc(f)}</li>`).join("") + (r.positives || []).map((f) => `<li>${esc(f)}</li>`).join("");
  const metrics = [
    r.hrv?.watch_normal_range?.[0] ? { key: "hrv", label: "HRV (overnight)", unit: "ms", dec: 0, band: r.hrv.watch_normal_range, note: `shaded: your current ${watch()} normal range` }
      : { key: "hrv", label: "HRV (overnight)", unit: "ms", dec: 0, band: r.hrv?.normal_range_60d, note: "shaded: your 60-day normal range" },
    { key: "rhr", label: "Resting HR", unit: "bpm", dec: 0 },
    { key: "sleep_h", label: "Sleep", unit: "h", dec: 1 },
    { key: "sleep_score", label: "Sleep score", unit: "", dec: 0 },
    { key: "stress_avg", label: "Stress (daily avg)", unit: "", dec: 0 },
    ...(d.app.provider === "coros" ? [{ key: "recovery_pct", label: "COROS recovery (morning)", unit: "%", dec: 0, connect: true, dots: true }]
      : [{ key: "bb_high", label: "Body Battery (daily high)", unit: "", dec: 0 }, { key: "weight_kg", label: "Weight", unit: "kg", dec: 1, connect: true, dots: true }]),
  ];
  const cards = metrics.map((m) => {
    const vals = d.health.map((h) => h[m.key]).filter((v) => v !== null && v !== undefined);
    const last7 = mean(d.health.slice(-7).map((h) => h[m.key]).filter((v) => v !== null && v !== undefined));
    const all = mean(vals);
    mount("hc-" + m.key, (c) => lineChart(c, { rows: d.health, height: 130, band: m.band, connect: m.connect, dots: m.dots, endLabels: true, decimals: m.dec, aria: `${m.label}, last 90 days`,
      series: [{ key: m.key, label: m.label, color: "var(--series-1)" }] }));
    return `<section class="card"><h2>${esc(m.label)}${m.unit ? ` (${esc(m.unit)})` : ""}<span class="muted">7-day ${fmt(last7, m.dec)} · 90-day ${fmt(all, m.dec)}</span></h2>
      <div class="chart" id="hc-${m.key}"></div>${m.note ? `<div class="muted">${esc(m.note)}</div>` : ""}</section>`;
  }).join("");
  return `<div class="grid two"><section class="card"><h2>Readiness today</h2><div class="row"><span class="pill"><span class="dot" style="background:${st.color}"></span>${st.icon} ${esc(st.label)}</span></div>
      ${flags ? `<ul class="flags">${flags}</ul>` : '<div class="empty" style="margin-top:8px">No flags.</div>'}</section>
    <section class="card"><h2>Last 30 days</h2>${healthTiles(d, "spk-h")}</section></div>
    <div class="grid two">${cards}</div>`;
}

// ---------------------------------------------------------------- Sleep
const STAGES = [["deep_min", "Deep", "var(--stage-deep)"], ["rem_min", "REM", "var(--stage-rem)"], ["light_min", "Light", "var(--stage-light)"], ["awake_min", "Awake", "var(--stage-awake)"]];
const has = (v) => v !== null && v !== undefined;
const clockOf = (m) => { if (!has(m)) return "–"; const v = ((Math.round(m) % 1440) + 1440) % 1440; return `${pad(Math.floor(v / 60))}:${pad(v % 60)}`; };
const isLate = (n) => has(n.last_end_h) && n.last_end_h < 3;
const nightTip = (n) => `<div><b>Night of ${esc(wday(n.night_of))} ${esc(dshort(n.night_of))}</b></div>
  ${has(n.bed_min) ? `<div>${esc(n.bed)} – ${esc(n.wake)} · ${esc(hm(n.asleep_min) || "–")} asleep</div>` : `<div>${esc(hm(n.asleep_min) || "–")} asleep</div>`}
  <div>Score ${fmt(n.score)}${has(n.efficiency) ? ` · efficiency ${fmt(n.efficiency)}%` : ""}</div>
  ${n.train_min >= 15 ? `<div>Day: ${fmt(n.tss)} TSS${n.last_session ? ` · last ${esc(n.last_session)}${has(n.last_end_h) ? `, ${fmt(n.last_end_h, 1)} h before bed` : ""}` : ""}</div>` : "<div>Rest day</div>"}
  ${n.evening_mobility ? `<div>${esc(n.evening_mobility)}</div>` : ""}`;

/* Bed-to-wake bar per night (time runs downward), usual bed and wake as dashed lines, and a marker row for
   late sessions (dot) and evening yoga / mobility (ring). */
function rhythmChart(container, nights, rh) {
  container.innerHTML = "";
  const timed = nights.filter((n) => has(n.bed_min));
  if (timed.length < 3) { container.innerHTML = '<div class="empty">No bed and wake times yet.</div>'; return; }
  const days = []; for (let k = timed[0].date; k <= nights[nights.length - 1].date; k = addDays(k, 1)) days.push(k);
  const byDate = new Map(nights.map((n) => [n.date, n]));
  const W = container.clientWidth || 600, H = 240, m = { l: 40, r: 8, t: 8, b: 36 }, n = days.length, plotB = H - m.b;
  const lo = Math.floor((Math.min(...timed.map((x) => x.bed_min)) - 20) / 60) * 60, hi = Math.ceil((Math.max(...timed.map((x) => x.wake_min)) + 20) / 60) * 60;
  const band = (W - m.l - m.r) / n, bw = Math.max(2, Math.min(10, band * 0.62));
  const y = (v) => m.t + ((v - lo) / (hi - lo)) * (plotB - m.t), cx = (i) => m.l + band * (i + 0.5);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Bedtime and wake time per night" }, container);
  const step = hi - lo > 720 ? 180 : 120;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const t = el("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, svg); t.textContent = clockOf(v);
  }
  let lastMonth = null;
  days.forEach((k, i) => {
    if (k.slice(0, 7) !== lastMonth && i > 2 && i < n - 3) {
      const t = el("text", { x: cx(i), y: H - 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, svg);
      t.textContent = pd(k).toLocaleDateString(undefined, { month: "short" });
    }
    lastMonth = k.slice(0, 7);
  });
  days.forEach((k, i) => {
    const x = byDate.get(k);
    if (!x) return;
    if (has(x.bed_min)) el("rect", { x: cx(i) - bw / 2, width: bw, y: y(x.bed_min), height: Math.max(1, y(x.wake_min) - y(x.bed_min)), rx: Math.min(4, bw / 2), fill: "var(--series-1)" }, svg);
    if (isLate(x)) el("circle", { cx: cx(i), cy: plotB + 12, r: 4, fill: "var(--series-2)" }, svg);
    if (x.evening_mobility) el("circle", { cx: cx(i), cy: plotB + 12, r: isLate(x) ? 6.5 : 4, fill: "none", stroke: "var(--ink-2)", "stroke-width": 1.5 }, svg);
  });
  for (const [v, label, below] of [[rh.bed_median_min, `usual bed ${rh.bed_median}`, false], [rh.wake_median_min, `usual wake ${rh.wake_median}`, true]]) {
    if (!has(v)) continue;
    el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--ink-2)", "stroke-width": 1, "stroke-dasharray": "4 4" }, svg);
    const t = el("text", { x: W - m.r - 2, y: y(v) + (below ? 14 : -5), "text-anchor": "end", fill: "var(--ink-2)", "font-size": 11, "paint-order": "stroke", stroke: "var(--surface)", "stroke-width": 3 }, svg);
    t.textContent = label;
  }
  days.forEach((k, i) => {
    const x = byDate.get(k);
    if (!x) return;
    const hit = el("rect", { x: m.l + band * i, y: 0, width: band, height: H, fill: "transparent" }, svg);
    const show = () => { const box = svg.getBoundingClientRect(); showTip(nightTip(x), box.left + window.scrollX + (cx(i) / W) * box.width, box.top + window.scrollY + (y(has(x.bed_min) ? x.bed_min : lo) / H) * box.height); };
    hit.addEventListener("mousemove", show); hit.addEventListener("touchstart", show, { passive: true });
    hit.addEventListener("mouseleave", hideTip); hit.addEventListener("touchend", () => setTimeout(hideTip, 1500));
  });
}

/* Stacked minutes per night: deep at the base, then REM, light and awake, with a surface gap between segments. */
function stageBars(container, nights) {
  container.innerHTML = "";
  const tot = (x) => STAGES.reduce((a, [k]) => a + (x[k] || 0), 0);
  const list = nights.filter((x) => tot(x) > 0);
  if (!list.length) { container.innerHTML = '<div class="empty">No sleep stages yet.</div>'; return; }
  const days = []; for (let k = list[0].date; k <= nights[nights.length - 1].date; k = addDays(k, 1)) days.push(k);
  const byDate = new Map(list.map((x) => [x.date, x]));
  const W = container.clientWidth || 600, H = 180, m = { l: 34, r: 8, t: 8, b: 22 }, n = days.length;
  const hi = Math.ceil(Math.max(...list.map(tot)) / 120) * 120;
  const band = (W - m.l - m.r) / n, bw = Math.max(3, Math.min(18, band * 0.68));
  const y = (v) => m.t + (1 - v / hi) * (H - m.t - m.b), cx = (i) => m.l + band * (i + 0.5);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Sleep stages per night" }, container);
  for (let v = 0; v <= hi; v += 120) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }, svg);
    const t = el("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, svg); t.textContent = `${v / 60}h`;
  }
  // Date labels: the last night always, others only where they don't crowd a neighbour.
  const placed = [n - 1];
  days.forEach((k, i) => { if (placed.every((j) => Math.abs(cx(i) - cx(j)) >= 56)) placed.push(i); });
  for (const i of placed) { const t = el("text", { x: cx(i), y: H - 4, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, svg); t.textContent = dshort(days[i]); }
  days.forEach((k, i) => {
    const x = byDate.get(k);
    if (!x) return;
    let base = 0;
    for (const [key, , color] of STAGES) {
      const v = x[key] || 0;
      if (!v) continue;
      el("rect", { x: cx(i) - bw / 2, width: bw, y: y(base + v), height: Math.max(0.5, y(base) - y(base + v)), rx: 1.5, fill: color, stroke: "var(--surface)", "stroke-width": 1 }, svg);
      base += v;
    }
    const hit = el("rect", { x: m.l + band * i, y: 0, width: band, height: H, fill: "transparent" }, svg);
    const show = () => {
      const box = svg.getBoundingClientRect();
      showTip(`<div><b>Night of ${esc(wday(x.night_of))} ${esc(dshort(x.night_of))}</b> · score ${fmt(x.score)}</div>${STAGES.map(([kk, label, color]) => `<div><span class="k" style="background:${color}"></span>${label}: <b>${esc(hm(x[kk]) || "–")}</b></div>`).join("")}`,
        box.left + window.scrollX + (cx(i) / W) * box.width, box.top + window.scrollY + (y(tot(x)) / H) * box.height);
    };
    hit.addEventListener("mousemove", show); hit.addEventListener("touchstart", show, { passive: true });
    hit.addEventListener("mouseleave", hideTip); hit.addEventListener("touchend", () => setTimeout(hideTip, 1500));
  });
}
const STAGE_LEGEND = `<div class="legend">${STAGES.map(([, label, color]) => `<span class="key"><span class="sw" style="background:${color}"></span>${label}</span>`).join("")}</div>`;

const FINDING = { improve: ["!", "var(--warning)", "var(--marker-ink)", "To improve"], good: ["✓", "var(--good)", "#fff", "Works"], info: ["i", "var(--muted)", "#fff", "Note"] };
function findingRow(f) {
  const [ic, bg, ink, label] = FINDING[f.level] || FINDING.info;
  return `<div class="finding"><span class="ic" style="background:${bg};color:${ink}" role="img" aria-label="${label}">${ic}</span><b>${esc(f.title)}</b><p>${esc(f.text)}</p></div>`;
}

const SLEEP_QUALITY = ["score", "asleep_min", "efficiency", "deep_min", "rem_min", "awake_min"];
const VERDICT = { clear: "clear", possible: "possible", none: "no difference", too_few: "too few nights", no_data: "–" };
function diffText(r) {
  if (!has(r.diff)) return "–";
  if (r.metric === "bed_min") return `${fmt(Math.abs(r.diff))} min ${r.diff > 0 ? "later" : "earlier"}`;
  return `${r.diff > 0 ? "+" : "−"}${fmt(Math.abs(r.diff), Math.abs(r.diff) < 10 && r.unit !== "min" ? 1 : 0)}${r.unit === "%" ? " pts" : r.unit ? " " + r.unit : ""}`;
}
const metricVal = (r, v) => !has(v) ? "–" : r.metric === "bed_min" ? clockOf(v) : r.metric === "asleep_min" ? hm(v) : `${fmt(v)}${r.unit === "%" ? "%" : ""}`;

// Comparisons that found something come first.
const influenceRank = (inf) => inf.n < 4 || inf.n_rest < 4 ? 2 : inf.metrics.some((r) => r.verdict === "clear" || r.verdict === "possible") ? 0 : 1;
function influenceBlock(inf) {
  const rows = inf.metrics.filter((r) => r.verdict !== "no_data");
  const sig = rows.filter((r) => (r.verdict === "clear" || r.verdict === "possible") && r.metric !== "bed_min");
  // Worse / better sleep is judged on the night itself; sleep HR, HRV and resting HR alone are recovery markers.
  const quality = sig.filter((r) => SLEEP_QUALITY.includes(r.metric));
  const worse = quality.filter((r) => r.effect === "worse").length, better = quality.filter((r) => r.effect === "better").length;
  const [label, color, icon] = inf.n < 4 || inf.n_rest < 4 ? ["Too few nights", "var(--muted)", "?"]
    : !sig.length ? ["No effect seen", "var(--muted)", "="] : !quality.length ? ["Only HR / HRV moved", "var(--muted)", "~"]
    : worse > better ? ["Worse sleep", "var(--critical)", "▼"] : better > worse ? ["Better sleep", "var(--good)", "▲"] : ["Mixed", "var(--warning)", "◐"];
  const ctx = [inf.tss_median && (inf.tss_median[0] || inf.tss_median[1]) ? `median day TSS ${fmt(inf.tss_median[0])} vs ${fmt(inf.tss_median[1])}` : "",
    inf.bed_min_median ? `median bedtime ${clockOf(inf.bed_min_median[0])} vs ${clockOf(inf.bed_min_median[1])}` : ""].filter(Boolean).join(" · ");
  const table = rows.length && inf.n ? `<details><summary>Numbers: ${esc(inf.group)} (${inf.n}) vs ${esc(inf.rest)} (${inf.n_rest})</summary>${ctx ? `<p class="muted">${esc(ctx)}</p>` : ""}${inf.note ? `<p class="muted">${esc(inf.note)}</p>` : ""}<div class="scroll"><table><thead><tr><th>Metric</th><th class="num">${esc(inf.group)}</th><th class="num">${esc(inf.rest)}</th><th class="num">Difference</th><th>Verdict</th></tr></thead><tbody>
    ${rows.map((r) => `<tr><td>${esc(r.label)}</td><td class="num">${esc(metricVal(r, r.mean))}</td><td class="num">${esc(metricVal(r, r.mean_rest))}</td>
      <td class="num ${r.effect || ""}">${esc(diffText(r))}</td><td>${esc(VERDICT[r.verdict] || "")}${r.effect ? ` · ${r.effect}` : ""}</td></tr>`).join("")}</tbody></table></div></details>` : "";
  return `<div class="influence"><h3>${esc(inf.question)}<span class="badge"><span class="dot" style="background:${color}"></span>${icon} ${esc(label)}</span></h3>
    <p>${esc(inf.summary)}</p>${table}</div>`;
}

const sleepStat = (v, label) => `<div><div class="value">${v}</div><div class="label">${esc(label)}</div></div>`;

function lastNightCard(s) {
  const n = s.last_night, p = s.periods["30d"];
  const staged = STAGES.reduce((a, [k]) => a + (n[k] || 0), 0);
  const split = staged ? `<div class="split" role="img" aria-label="Sleep stages last night">${STAGES.filter(([k]) => n[k]).map(([k, , c]) => `<span style="--c:${c};flex:${n[k]}"></span>`).join("")}</div>
    <div class="legend">${STAGES.map(([k, label, c]) => `<span class="key"><span class="sw" style="background:${c}"></span>${label} ${esc(hm(n[k]) || "–")}</span>`).join("")}</div>` : "";
  const day = n.train_min >= 15 ? `${fmt(n.tss)} TSS · ${hm(n.train_min)} of training${n.last_session ? ` · last: ${n.last_session}${has(n.last_end_h) ? `, ${fmt(n.last_end_h, 1)} h before bed` : ""}` : ""}` : "Rest day";
  return `<section class="card"><div class="kicker">Last night · ${esc(wday(n.night_of))} ${esc(dshort(n.night_of))} → ${esc(wday(n.date))}${n.date !== todayKey() ? ` · latest synced` : ""}</div>
    <h1 class="headline">${has(n.bed_min) ? `${esc(n.bed)} – ${esc(n.wake)}` : esc(hm(n.asleep_min) || "No times")}</h1>
    <div class="stats" style="margin-top:12px">
      ${sleepStat(fmt(n.score), `Score · 30-day ${fmt(p.score)}`)}
      ${sleepStat(esc(hm(n.asleep_min) || "–"), `Asleep · need ${fmt(s.need_h, 1)} h`)}
      ${sleepStat(has(n.efficiency) ? `${fmt(n.efficiency)}<small>%</small>` : "–", `Efficiency · 30-day ${fmt(p.efficiency)}%`)}
      ${sleepStat(has(n.sleep_hr) ? `${fmt(n.sleep_hr)}<small>bpm</small>` : "–", `Sleep HR · 30-day ${fmt(p.sleep_hr)}`)}
      ${sleepStat(has(n.hrv) ? `${fmt(n.hrv)}<small>ms</small>` : "–", `HRV · 30-day ${fmt(p.hrv)}`)}</div>
    ${split}
    <div class="sub" style="margin-top:6px">Day before: ${esc(day)}${n.evening_mobility ? ` · ${esc(n.evening_mobility)}` : ""}${has(n.awake_count) ? ` · woke ${fmt(n.awake_count)}× (>5 min)` : ""}</div></section>`;
}

function sleepSummaryCard(s) {
  const p = s.periods["30d"], rh = s.rhythm, b = s.score_bands, total = Object.values(b).reduce((a, v) => a + v, 0);
  return `<section class="card"><h2>Last 30 days <span class="muted">${p.nights} nights</span></h2>
    <div class="stats">
      ${sleepStat(`${fmt(p.asleep_h, 1)}<small>h</small>`, `Avg asleep · ${fmt(p.nights_need_pct)}% of nights reach your ${fmt(s.need_h, 1)} h`)}
      ${sleepStat(fmt(p.score), `Avg score${has(s.trend.score_diff) ? ` · ${s.trend.score_diff > 0 ? "▲" : "▼"} ${fmt(Math.abs(s.trend.score_diff))} vs 30 days before` : ""}`)}
      ${sleepStat(has(s.debt_14d_h) ? `${fmt(s.debt_14d_h, 1)}<small>h</small>` : "–", "Sleep debt · last 14 nights")}
      ${sleepStat(has(rh.mid_sd_min) ? `±${fmt(rh.mid_sd_min)}<small>min</small>` : "–", `Rhythm${rh.rating ? ": " + rh.rating : ""} (midpoint spread)`)}
      ${sleepStat(esc(s.target_bedtime || "–"), `Lights out for ${fmt(s.need_h, 1)} h by your ${s.target_wake || "usual"} wake-up`)}</div>
    ${help(`Score bands, ${total} nights: ${Object.entries(b).map(([k, v]) => `${esc(k)} ${v} (${total ? Math.round((v / total) * 100) : 0}%)`).join(" · ")}<br>
      Deep ${fmt(p.deep_pct)}% · REM ${fmt(p.rem_pct)}% of sleep · ~${fmt(p.awake_min)} min awake per night · avg ${esc(p.bed || "–")} – ${esc(p.wake || "–")}`)}</section>`;
}

function viewSleep(d) {
  const s = d.sleep;
  if (!s || !s.nights || !s.nights.length) return `${sourceBanner(d)}<section class="card"><h2>Sleep</h2><div class="empty">No sleep data yet. It shows up after the first sync with nights recorded on the watch.</div></section>`;
  const rh = s.rhythm, ns = s.nights;
  mount("sl-rhythm", (c) => rhythmChart(c, ns.slice(-60), rh));
  mount("sl-stages", (c) => stageBars(c, ns.filter((n) => n.date > addDays(todayKey(), -31))));
  mount("sl-score", (c) => lineChart(c, { rows: d.health, height: 140, endLabels: true, aria: "Sleep score, last 90 days", band: [80, 100], series: [{ key: "sleep_score", label: "Sleep score", color: "var(--series-1)" }] }));
  mount("sl-hours", (c) => lineChart(c, { rows: d.health, height: 140, endLabels: true, decimals: 1, aria: "Hours asleep, last 90 days", band: [s.need_h, s.need_h + 1], series: [{ key: "sleep_h", label: "Asleep (h)", color: "var(--series-1)" }] }));
  const rhythmStats = [[esc(rh.bed_median || "–"), "Usual bedtime", `±${fmt(rh.bed_sd_min)} min`], [esc(rh.wake_median || "–"), "Usual wake-up", `±${fmt(rh.wake_sd_min)} min`],
    [esc(rh.mid_median || "–"), "Sleep midpoint", `±${fmt(rh.mid_sd_min)} min · last 14 nights ±${fmt(rh.mid_sd_14d_min)}`],
    [has(rh.night_to_night_shift_min) ? `${fmt(rh.night_to_night_shift_min)}<small>min</small>` : "–", "Shift night to night", "average change of the midpoint"],
    [has(rh.social_jetlag_min) ? `${rh.social_jetlag_min > 0 ? "+" : ""}${fmt(rh.social_jetlag_min)}<small>min</small>` : "–", "Weekend shift", "Fri/Sat nights vs Sun–Thu"],
    [has(rh.bed_within_30_pct) ? `${fmt(rh.bed_within_30_pct)}<small>%</small>` : "–", "Bedtime within 30 min", `of usual · wake-up ${fmt(rh.wake_within_30_pct)}%`]];
  const metric = (k, v) => !has(v) ? "–" : k === "asleep_min" ? hm(v) : fmt(v);
  const bins = s.load_bins.map((b) => `<tr><td>${esc(b.label)}</td><td class="num">${b.n}</td>${["score", "asleep_min", "deep_min", "awake_min", "sleep_hr", "hrv"].map((k) => `<td class="num">${esc(metric(k, b[k]))}</td>`).join("")}</tr>`).join("");
  const corr = s.correlations.map((c) => `<tr><td>${esc(c.label)}</td><td class="num">${c.n}</td><td class="num">${c.rho > 0 ? "+" : ""}${fmt(c.rho, 2)}</td><td>${esc(c.strength)}${c.clear ? " · clear" : ""}</td></tr>`).join("");
  const wk = s.weekdays.map((w) => `<tr><td>${esc(w.night)}</td><td class="num">${w.n}</td><td class="num">${fmt(w.asleep_h, 1)} h</td><td class="num">${fmt(w.score)}</td><td class="num">${esc(w.bed || "–")}</td><td class="num">${esc(w.wake || "–")}</td><td class="num">${fmt(w.tss)}</td></tr>`).join("");
  const cyc = s.cycle.length ? `<section class="card"><h2>Cycle phase <span class="muted">from ${esc(watch())} cycle tracking · context, not a rule</span></h2><div class="scroll"><table><thead><tr><th>Phase</th><th class="num">Nights</th><th class="num">Asleep</th><th class="num">Score</th><th class="num">Awake min</th><th class="num">Sleep HR</th><th class="num">HRV</th></tr></thead><tbody>
    ${s.cycle.map((c) => `<tr><td>${esc(c.phase)}</td><td class="num">${c.n}</td><td class="num">${fmt(c.asleep_h, 1)} h</td><td class="num">${fmt(c.score)}</td><td class="num">${fmt(c.awake_min)}</td><td class="num">${fmt(c.sleep_hr)}</td><td class="num">${fmt(c.hrv)}</td></tr>`).join("")}</tbody></table></div></section>` : "";
  const all = [...ns].reverse().slice(0, 60).map((n) => `<tr><td style="white-space:nowrap">${esc(wday(n.night_of))} ${esc(dshort(n.night_of))}</td><td class="num">${esc(n.bed || "–")}</td><td class="num">${esc(n.wake || "–")}</td>
    <td class="num">${esc(hm(n.asleep_min) || "–")}</td><td class="num">${fmt(n.score)}</td><td class="num">${has(n.efficiency) ? fmt(n.efficiency) + "%" : "–"}</td><td class="num">${esc(hm(n.deep_min) || "–")}</td><td class="num">${esc(hm(n.rem_min) || "–")}</td>
    <td class="num">${fmt(n.awake_min)}</td><td class="num">${fmt(n.sleep_hr)}</td><td class="num">${fmt(n.hrv)}</td>
    <td>${n.train_min >= 15 ? `${fmt(n.tss)} TSS${n.last_session ? ` · ${esc(n.last_session)}` : ""}` : "rest"}${n.evening_mobility ? ` · ${esc(n.evening_mobility)}` : ""}</td></tr>`).join("");
  return `${sourceBanner(d)}<div class="grid two">${lastNightCard(s)}${sleepSummaryCard(s)}</div>
    <section class="card"><h2>What to improve <span class="muted">from ${s.window.nights} nights, ${esc(dshort(s.window.start))} – ${esc(dshort(s.window.end))}</span></h2>
      ${s.findings.length ? topList(s.findings.map(findingRow)) : '<div class="empty">Nothing stands out yet.</div>'}
      ${help(`Sleep need: ${esc(s.need_source)}. Tell the coach how many hours you feel best on to change it.`)}</section>
    <section class="card"><h2>Sleep rhythm <span class="muted">last 60 nights · time runs down</span></h2>
      <div class="stats">${rhythmStats.map(([v, l, sub]) => `<div><div class="value">${v}</div><div class="label">${esc(l)}<br>${esc(sub)}</div></div>`).join("")}</div>
      <div class="legend"><span class="key"><span class="sw" style="background:var(--series-1)"></span>Asleep (bed to wake)</span><span class="key"><span class="dash"></span>Usual bed / wake</span>
        <span class="key"><span class="sw" style="background:var(--series-2);border-radius:50%"></span>Session ended &lt; 3 h before bed</span><span class="key"><span class="sw outline" style="border-radius:50%;background:none"></span>Evening yoga / mobility</span></div>
      <div class="chart" id="sl-rhythm"></div></section>
    <div class="grid two"><section class="card"><h2>Sleep score<span class="muted">7-day ${fmt(s.periods["7d"].score)} · 30-day ${fmt(s.periods["30d"].score)}</span></h2><div class="chart" id="sl-score"></div><div class="muted">shaded: good and excellent (80+)</div></section>

      ${help("Clear = a difference this size is unlikely to be chance (|t| ≥ 2.5); possible = a hint worth watching. These are associations: hard days, late sessions and late nights often come together.")}</section>

      <section class="card"><h2>Weekday pattern <span class="muted">by the night's evening</span></h2><div class="scroll"><table><thead><tr><th>Night</th><th class="num">n</th><th class="num">Asleep</th><th class="num">Score</th><th class="num">Bed</th><th class="num">Wake</th><th class="num">Day TSS</th></tr></thead><tbody>${wk}</tbody></table></div></section></div>

// ---------------------------------------------------------------- Load
function viewLoad(d) {
  const tk = todayKey(), t = loadToday(d);
  const proj = d.load.some((r) => r.projected);
  const byWeek = new Map();
  for (const r of d.load) {
    const k = mondayOf(r.date), e = byWeek.get(k) || { key: k, done: 0, proj: 0, anyDone: false };
    if (r.projected) e.proj += r.tss || 0; else { e.done += r.tss || 0; e.anyDone = true; }
    byWeek.set(k, e);
  }
  const items = [...byWeek.values()].map((e) => {
    const pw = weekOf(e.key);
    const planned = pw ? pw.planned_tss : (e.anyDone ? null : Math.round(e.proj));
    return { key: e.key, planned: planned || null, actual: e.anyDone ? Math.round(e.done) : null, current: e.key === mondayOf(tk), href: pw ? `plan/week/${e.key}` : null,
      tip: `<b>Week of ${esc(dshort(e.key))}</b>${e.anyDone ? `<div>Done: ${fmt(e.done)} TSS</div>` : ""}${planned ? `<div>Planned: ${fmt(planned)} TSS</div>` : ""}` };
  });
  const table = d.load.filter((r, i) => i % 7 === 0 || r.date === tk).map((r) =>
    `<tr><td>${esc(r.date)}${r.projected ? " (plan)" : ""}</td><td class="num">${fmt(r.tss)}</td><td class="num">${fmt(r.ctl)}</td><td class="num">${fmt(r.atl)}</td><td class="num">${fmt(r.tsb)}</td></tr>`).join("");
  const evs = (d.events || []).map((e) => ({ date: e.date, name: e.name }));
  mount("pmc", (c) => lineChart(c, { rows: d.load, height: 210, todayKey: tk, events: evs, endLabels: true, aria: "Fitness and fatigue over time",
    series: [{ key: "ctl", label: "Fitness (CTL)", color: "var(--series-1)" }, { key: "atl", label: "Fatigue (ATL)", color: "var(--series-2)" }],
    tipRows: [["Fitness", "ctl", "var(--series-1)"], ["Fatigue", "atl", "var(--series-2)"], ["Form", "tsb"], ["TSS", "tss"]] }));
  mount("tsb", (c) => lineChart(c, { rows: d.load, height: 120, todayKey: tk, zeroLine: true, aria: "Form over time",
    series: [{ key: "tsb", label: "Form (TSB)", color: "var(--series-1)" }], tipRows: [["Form (TSB)", "tsb", "var(--series-1)"], ["TSS", "tss"]] }));
  mount("load-bars", (c) => weekBars(c, items, { height: 150, aria: "TSS per week" }));
  const acwr = t.ctl ? t.atl / t.ctl : null;
  return `<section class="card"><h2>Training load · today</h2>${loadStats(d)}
      <div class="muted">ACWR ${fmt(acwr, 2)} (sweet spot 0.8–1.3) · all sports combined</div>
      <div class="muted">Thresholds: bike FTP ${d.athlete.ftp ? fmt(d.athlete.ftp) + " W" : "not set"} · run ${d.athlete.run_threshold_pace ? d.athlete.run_threshold_pace + "/km" : "not set"} · swim CSS ${d.athlete.css_pace ? d.athlete.css_pace + "/100 m" : "not set"}</div></section>
    <section class="card"><h2>Fitness and fatigue</h2>
      <div class="legend"><span class="key"><span class="line" style="background:var(--series-1)"></span>Fitness (CTL)</span><span class="key"><span class="line" style="background:var(--series-2)"></span>Fatigue (ATL)</span>${proj ? '<span class="key"><span class="dash"></span>Projected from plan</span>' : ""}</div>
      <div class="chart" id="pmc"></div>
      <div class="legend" style="margin-top:14px">Form (TSB): fresh above 0, productive −10 to −30</div>
      <div class="chart" id="tsb"></div></section>
    <section class="card"><h2>TSS per week</h2><div class="chart" id="load-bars"></div>${BAR_LEGEND}
      <details><summary>Data table (weekly)</summary><div class="scroll"><table><thead><tr><th>Date</th><th class="num">TSS</th><th class="num">CTL</th><th class="num">ATL</th><th class="num">TSB</th></tr></thead><tbody>${table}</tbody></table></div></details></section>`;
}

// ---------------------------------------------------------------- Sessions
const activityLink = (a, text) => `<a href="#session/${a.id}">${text}</a>` + (DATA.app.provider === "garmin"
  ? ` <a href="https://connect.garmin.com/modern/activity/${encodeURIComponent(a.id)}" target="_blank" rel="noopener" class="muted" title="Open in Garmin Connect">↗</a>` : "");

function viewRides(d) {
  const rides = d.recent_sessions.filter((a) => a.sport === "bike");
  const others = d.recent_sessions.length - rides.length;
  const otherLine = others ? `<div class="muted" style="margin-top:6px">${others} other sessions (runs, swims, strength…) count toward load but are not listed here.</div>` : "";
  if (!rides.length) return `<section class="card"><h2>Rides</h2><div class="empty">No rides in the last 6 weeks.</div>${otherLine}</section>`;
  const since7 = addDays(todayKey(), -6);
  const sum = (list) => ({ n: list.length, h: list.reduce((a, r) => a + secs(r.time), 0) / 3600, km: list.reduce((a, r) => a + (r.distance_km || 0), 0), tss: list.reduce((a, r) => a + (r.tss || 0), 0), elev: list.reduce((a, r) => a + (r.elevation_m || 0), 0) });
  const s7 = sum(rides.filter((r) => r.start.slice(0, 10) >= since7)), s42 = sum(rides);
  const stat = (s, label) => `<div><div class="value">${s.n}<small>rides</small></div><div class="label">${esc(label)}: ${fmt(s.h, 1)} h · ${fmt(s.km)} km · ${fmt(s.elev)} m · ${fmt(s.tss)} TSS</div></div>`;
  const rows = rides.map((a) => {
    const day = a.start.slice(0, 10), inPlan = !!dayOf(day);
    return `<tr><td style="white-space:nowrap">${inPlan ? `<a href="#plan/day/${day}">${esc(dshort(day))}</a>` : esc(dshort(day))}</td>
      <td>${activityLink(a, esc(a.name || ""))}</td>
      <td class="num">${esc(a.time || "")}</td><td class="num">${fmt(a.distance_km)}</td><td class="num">${fmt(a.elevation_m)}</td>
      <td class="num">${fmt(a.avg_power)}</td><td class="num">${fmt(a.np)}</td><td class="num">${fmt(a.if, 2)}</td><td class="num">${fmt(a.tss)}</td>
      <td class="num">${fmt(a.avg_hr)}</td><td class="num">${fmt(a.ef, 2)}</td><td class="num">${a.decoupling_pct === undefined ? "–" : fmt(a.decoupling_pct, 1) + "%"}</td></tr>`;
  }).join("");
  return `<section class="card"><h2>Rides</h2><div class="stats">${stat(s7, "Last 7 days")}${stat(s42, "Last 6 weeks")}</div>${otherLine}</section>
    <section class="card"><h2>Last 6 weeks <span class="muted">date opens the plan day · name opens the ride${d.app.provider === "garmin" ? " · ↗ Garmin Connect" : ""}</span></h2><div class="scroll"><table><thead><tr>
      <th>Date</th><th>Ride</th><th class="num">Time</th><th class="num">km</th><th class="num">Elev m</th><th class="num">Avg W</th><th class="num">NP</th><th class="num">IF</th><th class="num">TSS</th><th class="num">HR</th><th class="num">EF</th><th class="num">Decoupl.</th>
    </tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function viewSessions(d) {
  if (cycling()) return viewRides(d);
  const list = d.recent_sessions;
  if (!list.length) return '<section class="card"><h2>Sessions</h2><div class="empty">No sessions in the last 6 weeks.</div></section>';
  const since7 = addDays(todayKey(), -6);
  const sum = (xs) => ({ n: xs.length, h: xs.reduce((a, r) => a + secs(r.time), 0) / 3600, tss: xs.reduce((a, r) => a + (r.tss || 0), 0) });
  const bySport = (xs) => ["swim", "bike", "run"].map((sp) => { const t = xs.filter((r) => r.sport === sp); return t.length ? `${SPORT[sp]} ${t.length}× ${fmt(sum(t).h, 1)} h · ${fmt(t.reduce((a, r) => a + (r.distance_km || 0), 0), sp === "swim" ? 1 : 0)} km` : ""; }).filter(Boolean).join(" · ");
  const w7 = list.filter((r) => r.start.slice(0, 10) >= since7);
  const stat = (xs, label) => { const s = sum(xs); return `<div><div class="value">${s.n}<small>sessions</small></div><div class="label">${esc(label)}: ${fmt(s.h, 1)} h · ${fmt(s.tss)} TSS<br>${esc(bySport(xs))}</div></div>`; };
  const speed = (a) => a.sport === "run" ? (a.pace_km ? a.pace_km + "/km" : "–") : a.sport === "swim" ? (a.pace_100m ? a.pace_100m + "/100m" : "–") : a.avg_speed_kmh ? fmt(a.avg_speed_kmh, 1) + " km/h" : "–";
  const rows = list.map((a) => {
    const day = a.start.slice(0, 10), inPlan = !!dayOf(day);
    return `<tr><td style="white-space:nowrap">${inPlan ? `<a href="#plan/day/${day}">${esc(dshort(day))}</a>` : esc(dshort(day))}</td>
      <td>${sportTag(a.sport)}${activityLink(a, esc(a.name || ""))}${a.note ? `<div class="sub">“${esc(a.note)}”</div>` : ""}</td>
      <td class="num">${esc(a.time || "")}</td><td class="num">${fmt(a.distance_km, a.sport === "swim" ? 2 : 1)}</td><td class="num">${esc(speed(a))}</td>
      <td class="num">${fmt(a.tss)}${a.tss_source && a.tss_source !== "excluded" ? `<div class="sub">${esc(a.tss_source)}</div>` : ""}</td><td class="num">${fmt(a.if, 2)}</td>
      <td class="num">${fmt(a.avg_hr)}</td><td class="num">${a.decoupling_pct === undefined ? "–" : fmt(a.decoupling_pct, 1) + "%"}</td><td class="num">${fmt(a.watch_load)}</td></tr>`;
  }).join("");
  return `<section class="card"><h2>Sessions</h2><div class="stats">${stat(w7, "Last 7 days")}${stat(list, "Last 6 weeks")}</div></section>
    <section class="card"><h2>Last 6 weeks <span class="muted">date opens the plan day · TSS source: power, pace, swim_pace, hr${d.app.provider === "coros" ? " or coros (COROS load, rates hard sessions high)" : " or garmin"}</span></h2><div class="scroll"><table><thead><tr>
      <th>Date</th><th>Session</th><th class="num">Time</th><th class="num">km</th><th class="num">Pace / speed</th><th class="num">TSS</th><th class="num">IF</th><th class="num">HR</th><th class="num">Decoupl.</th><th class="num">${esc(watch())} load</th>
    </tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

// ---------------------------------------------------------------- views loaded on demand
// Progress, recovery, sports, sessions and races come from /api/view/*: fetched when the tab opens, kept until the
// next refresh marks them stale, then re-fetched in the background while the old data stays on screen.
let VIEWS = {};
const LOADING = '<section class="card"><div class="empty">Loading…</div></section>';
function lazy(url, fn) {
  let v = VIEWS[url];
  if (!v || (v.stale && !v.pending)) {
    v = VIEWS[url] = { ...(v || {}), pending: true, stale: false };
    fetch(url, { cache: "no-store" })
      .then(async (res) => { const j = await res.json(); if (!res.ok || j.error) throw new Error(j.error || res.status); VIEWS[url] = { data: j }; })
      .catch((e) => { VIEWS[url] = { ...VIEWS[url], pending: false, error: e.message }; })
      .then(() => { if (DATA) render(); });
  }
  if (v.data) return fn(v.data);
  if (v.error) return `<section class="card"><div class="empty err">Could not load this view: ${esc(v.error)}</div></section>`;
  return LOADING;
}

const SPORT_COLOR = { swim: "var(--cat-1)", bike: "var(--cat-2)", run: "var(--cat-3)", strength: "var(--cat-4)", other: "var(--muted)" };
const sportLegend = (sports) => `<div class="legend">${sports.map((s) => `<span class="key"><span class="sw" style="background:${SPORT_COLOR[s]}"></span>${esc(SPORT[s] || s)}</span>`).join("")}</div>`;
const sessionHref = (id) => `#session/${id}`;
const paceFmt = (v) => pace(v);
const VERDICT_BADGE = {
  improving: ["Improving", "var(--good)", "▲"], declining: ["Slipping", "var(--critical)", "▼"], stable: ["Stable", "var(--muted)", "="],
  up: ["Higher", "var(--muted)", "▲"], down: ["Lower", "var(--muted)", "▼"],
};
const levelIcon = { good: ["✓", "var(--good)", "#fff"], warn: ["!", "var(--warning)", "var(--marker-ink)"], info: ["i", "var(--muted)", "#fff"] };
const noteRow = (level, text, title) => { const [ic, bg, ink] = levelIcon[level] || levelIcon.info;
  return `<div class="finding"><span class="ic" style="background:${bg};color:${ink}" role="img" aria-label="${level}">${ic}</span>${title ? `<b>${esc(title)}</b><p>${esc(text)}</p>` : `<span>${esc(text)}</span>`}</div>`; };
const statBox = (v, label) => `<div><div class="value">${v}</div><div class="label">${esc(label)}</div></div>`;
// Explanations and long lists stay one tap away instead of filling the screen.
const help = (html) => `<details class="help"><summary>How to read this</summary><div>${html}</div></details>`;
const topList = (rows, n = 3) => rows.length <= n ? rows.join("")
  : rows.slice(0, n).join("") + `<details class="more-items"><summary>${rows.length - n} more</summary>${rows.slice(n).join("")}</details>`;
const moreSections = (label, html) => `<details class="more-sections"><summary>${esc(label)}</summary>${html}</details>`;

/* Generic x/y chart: time ("time", ISO dates), log or linear x; line, dot and bar series; reference lines; one
   tooltip for the nearest point of every series. o: { series:[{points:[[x,y,extra]], color, label, kind, dash}],
   x, height, xmin, xmax, xticks, xfmt, yfmt, invert, zero, band, refs:[{y,label}], aria, onClick, empty } */
function xyChart(container, o) {
  container.innerHTML = "";
  const kx = (v) => o.x === "time" ? pd(v).getTime() : o.x === "log" ? Math.log(v) : v;
  const ser = o.series.map((s) => ({ ...s, pts: s.points.map((p) => [has(p[0]) ? kx(p[0]) : null, p[1], p]) }));
  const all = ser.flatMap((s) => s.pts.filter((p) => has(p[0]) && has(p[1])));
  if (!all.length) { container.innerHTML = `<div class="empty">${esc(o.empty || "No data yet.")}</div>`; return; }
  const W = container.clientWidth || 600, H = o.height || 170, m = { l: o.ml || 40, r: 10, t: 10, b: 22 };
  let xlo = has(o.xmin) ? kx(o.xmin) : Math.min(...all.map((p) => p[0])), xhi = has(o.xmax) ? kx(o.xmax) : Math.max(...all.map((p) => p[0]));
  if (xhi === xlo) { const pad0 = o.x === "time" ? 3 * DAY_MS : 1; xlo -= pad0; xhi += pad0; }
  const yv = all.map((p) => p[1]).concat(o.band || [], (o.refs || []).map((r) => r.y));
  let lo = Math.min(...yv, o.zero ? 0 : Infinity), hi = Math.max(...yv);
  const span = hi - lo || Math.abs(hi) * 0.1 || 1;
  if (!o.zero) lo -= span * 0.08;
  hi += span * 0.08;
  const ticks = niceTicks(lo, hi, 4);
  const plotW = W - m.l - m.r, plotH = H - m.t - m.b;
  const X = (x) => m.l + ((x - xlo) / (xhi - xlo)) * plotW;
  const Y = (v) => m.t + (o.invert ? (v - lo) / (hi - lo) : 1 - (v - lo) / (hi - lo)) * plotH;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.aria || "" }, container);
  if (o.band) el("rect", { x: m.l, width: plotW, y: Math.min(Y(o.band[0]), Y(o.band[1])), height: Math.abs(Y(o.band[0]) - Y(o.band[1])), fill: "var(--band)" }, svg);
  for (const t of ticks) {
    el("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t === 0 && o.zero ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    const tx = el("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, svg); tx.textContent = (o.yfmt || fmt)(t);
  }
  // x labels
  const labels = [];
  if (o.x === "time") {
    const days = (xhi - xlo) / DAY_MS;
    for (let t = xlo; t <= xhi; t += DAY_MS) {
      const dt = new Date(t), key = iso(dt);
      if (days > 75 ? dt.getDate() === 1 : dt.getDay() === 1) labels.push([t, days > 75 ? dt.toLocaleDateString(undefined, { month: "short" }) : dshort(key)]);
    }
  } else if (o.x === "log") (o.xticks || []).forEach(([v, l]) => labels.push([Math.log(v), l]));
  else niceTicks(xlo, xhi, 6).forEach((v) => labels.push([v, (o.xfmt || fmt)(v)]));
  let lastX = -Infinity;
  for (const [v, l] of labels) {
    if (v < xlo || v > xhi || X(v) - lastX < 44) continue;
    const t = el("text", { x: X(v), y: H - 4, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, svg); t.textContent = l; lastX = X(v);
  }
  for (const r of o.refs || []) {
    el("line", { x1: m.l, x2: W - m.r, y1: Y(r.y), y2: Y(r.y), stroke: "var(--ink-2)", "stroke-width": 1, "stroke-dasharray": "4 4" }, svg);
    if (r.label) { const t = el("text", { x: W - m.r - 2, y: Y(r.y) - 4, "text-anchor": "end", fill: "var(--ink-2)", "font-size": 11, "paint-order": "stroke", stroke: "var(--surface)", "stroke-width": 3 }, svg); t.textContent = r.label; }
  }
  for (const s of ser) {
    if (s.kind === "bar") {
      const bw = Math.max(1.5, Math.min(14, (o.x === "time" ? plotW / ((xhi - xlo) / DAY_MS + 1) : plotW / s.pts.length) * 0.7));
      const base = Y(Math.max(lo, 0));
      s.pts.forEach(([x, v]) => { if (has(x) && v) el("rect", { x: X(x) - bw / 2, width: bw, y: Math.min(base, Y(v)), height: Math.abs(base - Y(v)), rx: Math.min(2, bw / 2), fill: s.color }, svg); });
    } else if (s.kind === "dots") {
      s.pts.forEach(([x, v]) => { if (has(x) && has(v)) el("circle", { cx: X(x), cy: Y(v), r: 3.5, fill: s.color, opacity: 0.75, stroke: "var(--surface)", "stroke-width": 1 }, svg); });
    } else {
      let dpath = "", pen = false;
      s.pts.forEach(([x, v]) => { if (!has(x) || !has(v)) { pen = false; return; } dpath += (pen ? "L" : "M") + X(x).toFixed(1) + "," + Y(v).toFixed(1); pen = true; });
      if (dpath) el("path", { d: dpath, fill: "none", stroke: s.color, "stroke-width": s.width || 2, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": s.dash ? "5 4" : "none" }, svg);
      if (s.marks) s.pts.forEach(([x, v]) => { if (has(x) && has(v)) el("circle", { cx: X(x), cy: Y(v), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg); });
    }
  }
  // hover: nearest point per series
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink-2)", "stroke-width": 1, opacity: 0 }, svg);
  const hot = ser.map((s) => el("circle", { r: 4.5, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }, svg));
  const hit = el("rect", { x: m.l, y: 0, width: plotW, height: H, fill: "transparent", style: o.onClick ? "cursor:pointer" : "" }, svg);
  let picked = null;
  const move = (ev) => {
    const box = svg.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - box.left) * (W / box.width);
    const rows = [];
    picked = null;
    let anchor = null;
    ser.forEach((s, k) => {
      let best = null;
      for (const p of s.pts) if (has(p[0]) && has(p[1]) && (!best || Math.abs(X(p[0]) - px) < Math.abs(X(best[0]) - px))) best = p;
      if (!best || Math.abs(X(best[0]) - px) > (s.kind === "line" || !s.kind ? 40 : 18)) { hot[k].setAttribute("opacity", 0); return; }
      hot[k].setAttribute("cx", X(best[0])); hot[k].setAttribute("cy", Y(best[1])); hot[k].setAttribute("opacity", s.kind === "bar" ? 0 : 1);
      rows.push([s, best]);
      if (!anchor || Math.abs(X(best[0]) - px) < Math.abs(X(anchor[0]) - px)) anchor = best;
      if (best[2] && best[2][2] && best[2][2].id) picked = best[2][2];
    });
    if (!anchor) { cross.setAttribute("opacity", 0); hideTip(); return; }
    cross.setAttribute("x1", X(anchor[0])); cross.setAttribute("x2", X(anchor[0])); cross.setAttribute("opacity", 1);
    const head = o.tipTitle ? o.tipTitle(anchor[2]) : o.x === "time" ? dshort(anchor[2][0]) : o.x === "log" ? "" : (o.xfmt || fmt)(anchor[2][0]);
    const body = rows.map(([s, p]) => `<div><span class="k" style="background:${s.color}"></span>${esc(s.label || "")}${s.label ? ": " : ""}<b>${esc((s.tfmt || o.yfmt || fmt)(p[1]))}</b>${p[2][2] && p[2][2].name ? ` · ${esc(p[2][2].name)}` : ""}</div>`).join("");
    showTip(`${head ? `<div><b>${esc(head)}</b></div>` : ""}${body}${picked && o.onClick ? '<div class="muted">click to open</div>' : ""}`,
      box.left + window.scrollX + (X(anchor[0]) / W) * box.width, box.top + window.scrollY + (Math.min(...rows.map(([, p]) => Y(p[1]))) / H) * box.height);
  };
  const leave = () => { cross.setAttribute("opacity", 0); hot.forEach((h) => h.setAttribute("opacity", 0)); hideTip(); };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, { passive: true }); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", () => setTimeout(leave, 1500));
  if (o.onClick) hit.addEventListener("click", () => { if (picked) { hideTip(); o.onClick(picked); } });
}

/* Stacked bars per period (weeks or months). items: [{ key, label, segs:[[value, color, name]], tip, href, current, mark }] */
function stackBars(container, items, o = {}) {
  container.innerHTML = "";
  const n = items.length;
  if (!n || !items.some((it) => it.segs.some(([v]) => v))) { container.innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const W = container.clientWidth || 600, H = o.height || 160, m = { l: 36, r: 8, t: 14, b: 22 };
  const tot = (it) => it.segs.reduce((a, [v]) => a + (v || 0), 0);
  const ticks = niceTicks(0, Math.max(...items.map(tot)) * 1.05 || 1), hi = ticks[ticks.length - 1] || 1;
  const band = (W - m.l - m.r) / n, bw = Math.max(4, Math.min(28, band * 0.66));
  const y = (v) => m.t + (1 - v / hi) * (H - m.t - m.b), cx = (i) => m.l + band * (i + 0.5);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.aria || "" }, container);
  for (const t of ticks) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    const tx = el("text", { x: m.l - 6, y: y(t) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, svg); tx.textContent = (o.yfmt || fmt)(t);
  }
  const cur = items.findIndex((it) => it.current), placed = cur >= 0 ? [cur] : [];
  items.forEach((it, i) => { if (placed.every((j) => Math.abs(cx(i) - cx(j)) >= 52)) placed.push(i); });
  for (const i of placed) { const t = el("text", { x: cx(i), y: H - 4, "text-anchor": "middle", fill: i === cur ? "var(--ink)" : "var(--muted)", "font-size": 11, "font-weight": i === cur ? 600 : 400 }, svg); t.textContent = items[i].label; }
  items.forEach((it, i) => {
    let base = 0;
    it.segs.forEach(([v, color]) => {
      if (!v) return;
      el("rect", { x: cx(i) - bw / 2, width: bw, y: y(base + v), height: Math.max(0.5, y(base) - y(base + v)), rx: 2, fill: color, stroke: "var(--surface)", "stroke-width": 1 }, svg);
      base += v;
    });
    if (it.mark) { const t = el("text", { x: cx(i), y: y(base) - 3, "text-anchor": "middle", fill: "var(--ink)", "font-size": 12, "font-weight": 700 }, svg); t.textContent = it.mark; }
    const hit = el("rect", { x: m.l + band * i, y: 0, width: band, height: H, fill: "transparent", style: it.href ? "cursor:pointer" : "" }, svg);
    const show = () => { const box = svg.getBoundingClientRect(); showTip(it.tip, box.left + window.scrollX + (cx(i) / W) * box.width, box.top + window.scrollY + (y(base) / H) * box.height); };
    hit.addEventListener("mousemove", show); hit.addEventListener("touchstart", show, { passive: true });
    hit.addEventListener("mouseleave", hideTip); hit.addEventListener("touchend", () => setTimeout(hideTip, 1500));
    if (it.href) hit.addEventListener("click", () => { hideTip(); location.hash = it.href; });
  });
}

const zoneBars = (rows) => rows.length ? `<div class="zbars">${rows.map((r) => `<div class="zrow"><span>${esc(r.zone)}</span><span class="zt"><span style="width:${Math.min(100, r.pct || 0)}%"></span></span><span class="zv">${fmt(r.pct)}% · ${esc(hm((r.h || 0) * 60) || "0min")}</span></div>`).join("")}</div>` : "";
function threeZone(z) {

/* A trend from views._trend: dots per session, the 28-day median as a line, and a 6-vs-6-week verdict. */

}

// ---------------------------------------------------------------- Recovery
function recoveryCalendar(days) {
  if (!days.length) return '<div class="empty">No readiness data yet.</div>';
  const first = mondayOf(days[0].date), byDate = new Map(days.map((x) => [x.date, x]));
  let html = `<div class="cal"><span></span>${WD.map((w) => `<span class="h">${w}</span>`).join("")}`;
  for (let w = first; w <= todayKey(); w = addDays(w, 7)) {
    html += `<span class="cw">${esc(dshort(w))}</span>`;
    for (let i = 0; i < 7; i++) {
      const k = addDays(w, i), x = byDate.get(k);
      const cls = !x ? "out" : x.status || "none", st = STATUS[x?.status];
      html += `<span class="c ${cls}${k === todayKey() ? " today" : ""}" data-day="${k}">${x ? (st ? st.icon : "·") : ""}</span>`;
    }
  }
  return html + "</div>";
}
function bindCalendar(days) {
  const byDate = new Map(days.map((x) => [x.date, x]));
  document.querySelectorAll(".cal .c[data-day]").forEach((c) => {
    const x = byDate.get(c.dataset.day);
    if (!x) return;
    const show = () => {
      const r = c.getBoundingClientRect(), st = STATUS[x.status];
      showTip(`<div><b>${esc(wday(x.date))} ${esc(dshort(x.date))}</b> · ${esc(st ? st.label : "no data")}</div>

        <div>Sleep ${fmt(x.sleep_h, 1)} h${has(x.sleep_score) ? ` · score ${fmt(x.sleep_score)}` : ""} · TSS ${fmt(x.tss)}</div>${(x.flags || []).slice(0, 4).map((f) => `<div>• ${esc(f)}</div>`).join("")}`,
        r.left + window.scrollX + r.width / 2, r.top + window.scrollY);
    };
    c.addEventListener("mouseenter", show); c.addEventListener("touchstart", show, { passive: true });
    c.addEventListener("mouseleave", hideTip); c.addEventListener("touchend", () => setTimeout(hideTip, 1800));
  });
}

    mount("rc-sleep", (el2) => xyChart(el2, { ...common, aria: "Sleep hours", yfmt: (v) => fmt(v, 1), series: [{ points: days.map((x) => [x.date, x.sleep_h]), color: "var(--series-1)", label: "Sleep h" }] }));
