<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap">
<style>
:root {
  color-scheme: light;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
  --asphalt: #24272b;
  --asphalt-2: #2e3236;
  --asphalt-ink: #f2f3f1;
  --asphalt-muted: #a3a8ad;
  --col-yellow: #ffd100;
  --marker-ink: #16181a;
  --page: #eceeed;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --link: #1c5cab;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --band: rgba(42,120,214,0.10);
  --spark: #898781;
  --int-easy: #86b6ef;
  --int-moderate: #3987e5;
  --int-hard: #1c5cab;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --tip-bg: #0b0b0b;
  --tip-ink: #f0efec;
  /* Sleep stages: one blue ramp by depth (deep darkest), awake in the warm series colour. */
  --stage-deep: #104281;
  --stage-rem: #2a78d6;
  --stage-light: #86b6ef;
  --stage-awake: #eb6834;
  /* Categorical slots in fixed order (validated): sports use them as swim, bike, run, strength. */
  --cat-1: #2a78d6;
  --cat-2: #eb6834;
  --cat-3: #1baf7a;
  --cat-4: #eda100;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #101213;
    --asphalt: #1c1f22;
    --asphalt-2: #262a2e;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --link: #86b6ef;
    --series-1: #3987e5;
    --series-2: #d95926;
    --band: rgba(57,135,229,0.16);
    --spark: #898781;
    --int-easy: #184f95;
    --int-moderate: #3987e5;
    --int-hard: #86b6ef;
    --good-text: #0ca30c;
    --tip-bg: #f0efec;
    --tip-ink: #0b0b0b;
    --stage-deep: #86b6ef;
    --stage-rem: #3987e5;
    --stage-light: #184f95;
    --stage-awake: #d95926;
    --cat-1: #3987e5;
    --cat-2: #d95926;
    --cat-3: #199e70;
    --cat-4: #c98500;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #101213; --asphalt: #1c1f22; --asphalt-2: #262a2e; --surface: #1a1a19; --surface-2: #222220; --ink: #f0efec; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --link: #86b6ef;
  --series-1: #3987e5; --series-2: #d95926; --band: rgba(57,135,229,0.16);
  --int-easy: #184f95; --int-moderate: #3987e5; --int-hard: #86b6ef;
  --good-text: #0ca30c; --tip-bg: #f0efec; --tip-ink: #0b0b0b;
  --stage-deep: #86b6ef; --stage-rem: #3987e5; --stage-light: #184f95; --stage-awake: #d95926;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.45 var(--body);
  -webkit-text-size-adjust: 100%;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
header.band { background: var(--asphalt); color: var(--asphalt-ink); }
header.band .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 16px; flex-wrap: wrap; padding-top: 18px; padding-bottom: 6px; }
header.band h1 { font: italic 700 28px/1 var(--display); margin: 0; letter-spacing: 0.01em; }
header.band .meta { color: var(--asphalt-muted); }
.meta, .muted { color: var(--muted); font-size: 13px; }
nav.tabs { position: sticky; top: 0; z-index: 10; background: var(--asphalt); box-shadow: 0 1px 0 var(--asphalt-2); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 0 8px; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
nav.tabs a { position: relative; padding: 10px 12px 13px; color: var(--asphalt-muted); font: 600 18px/1.2 var(--display); white-space: nowrap; }
nav.tabs a:hover { color: var(--asphalt-ink); text-decoration: none; }
/* Active tab: a road-marking dash. */
nav.tabs .main a.on { color: var(--asphalt-ink); }
nav.tabs .main a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 4px; background: var(--col-yellow); transform: skewX(-24deg); }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 4px; }
nav.tabs a:focus-visible { outline-color: var(--col-yellow); }
nav.tabs .main a.gear { margin-left: auto; font-size: 20px; }
/* Pages inside the active section: a row of pills under the sections. */
nav.tabs .sub { gap: 6px; padding-bottom: 10px; }
nav.tabs .sub:empty { display: none; }
nav.tabs .sub a { padding: 5px 13px; border-radius: 999px; border: 1px solid var(--asphalt-2); font: 600 14px/1.2 var(--body); }
nav.tabs .sub a[aria-current="page"] { background: var(--col-yellow); border-color: var(--col-yellow); color: var(--marker-ink); }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
.grid + .grid, .card + .grid, .grid + .card, .card + .card { margin-top: 16px; }
.grid > .card { margin-top: 0; }
@media (min-width: 900px) { .grid.two { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-width: 0; }
.card h2 { font: 600 19px/1.2 var(--display); color: var(--ink); margin: 0 0 12px; display: flex; justify-content: space-between; gap: 4px 12px; align-items: baseline; flex-wrap: wrap; }
.card h2 a, .card h2 .muted { font: 500 13px/1.3 var(--body); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 600 15px/1.3 var(--display); border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.note { white-space: pre-wrap; margin: 10px 0 0; }
.note-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
ul.flags { margin: 10px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
ul.flags li { margin: 2px 0; }
.session { border-left: 4px solid var(--int-easy); padding: 2px 0 2px 12px; margin-top: 12px; }
.session .title { font: 600 20px/1.2 var(--display); }
.sub { color: var(--ink-2); font-size: 13px; }
.targets { font-size: 13px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
details.help { font-size: 13px; color: var(--muted); }
details.help > summary { color: var(--muted); list-style: none; }
details.help > summary::-webkit-details-marker { display: none; }
details.help > summary::before { content: "ⓘ "; }
details.help > div { margin-top: 4px; }
details.more-items > summary { color: var(--series-1); font-weight: 600; padding: 4px 0; }
details.more-sections { margin: 0 0 16px; }
details.more-sections > summary { list-style: none; margin: 0; padding: 12px 16px; border: 1px dashed var(--axis); border-radius: 12px; font: 600 15px/1.3 var(--display); color: var(--ink-2); text-align: center; }
details.more-sections > summary::-webkit-details-marker { display: none; }
details.more-sections > summary::after { content: " ▾"; }
details.more-sections[open] > summary { margin-bottom: 16px; }
details.more-sections[open] > summary::after { content: " ▴"; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface-2); border-radius: 6px; padding: 12px; min-width: 0; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font: 600 30px/1.1 var(--display); margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .value small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile .delta { font-size: 12px; color: var(--muted); min-height: 17px; }
.delta.good { color: var(--good-text); }
.delta.bad { color: var(--critical); }
.tile svg { display: block; width: 100%; height: 36px; margin-top: 6px; overflow: visible; }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); margin-bottom: 12px; }
.stats .value { font: 600 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stats .value small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.stats .label { color: var(--ink-2); font-size: 12px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .line { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.legend .dash { width: 16px; height: 0; border-top: 2px dashed var(--muted); display: inline-block; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .line.dash { background: repeating-linear-gradient(90deg, var(--ink-2) 0 4px, transparent 4px 8px); }
.legend .sw.outline { border: 1.5px solid var(--muted); background: var(--surface-2); }
.tooltip { position: absolute; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity .08s; z-index: 20; }
.tooltip .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); white-space: nowrap; }
.badge .dot { width: 8px; height: 8px; }
.changed { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.actual { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.empty { color: var(--muted); font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.int-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.int-legend span::before { content: ""; display: inline-block; width: 4px; height: 12px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; background: var(--c); }
.err { color: var(--critical); }

/* plan: shared */
.item { border-left: 4px solid var(--int-easy); padding-left: 10px; }
.item + .item { margin-top: 6px; }
.item.easy, .session.easy { border-color: var(--int-easy); }
.item.moderate, .session.moderate { border-color: var(--int-moderate); }
.item.hard, .session.hard { border-color: var(--int-hard); }
.item.rest, .session.rest { border-color: var(--grid); }
.item .title { font: 600 17px/1.25 var(--display); }
.title.skipped { text-decoration: line-through; color: var(--muted); }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.pager { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
.pager a, .pager span { display: inline-flex; align-items: center; gap: 4px; font: 600 15px/1.2 var(--display); padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink-2); }
.pager a:hover { color: var(--ink); text-decoration: none; background: var(--surface-2); }
.pager span { opacity: .4; }
a.rowlink { color: inherit; display: grid; border-radius: 8px; }
a.rowlink:hover { background: var(--surface-2); text-decoration: none; }
.chev { color: var(--muted); font-size: 18px; line-height: 1; align-self: center; }
.headline { font: italic 700 32px/1.05 var(--display); margin: 0; }
.subhead { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.section-label { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 18px 0 6px; }

/* plan: week rows */
.wk { grid-template-columns: minmax(0, 1fr) auto minmax(150px, auto) 14px; grid-template-areas: "t shape nums chev"; gap: 6px 16px; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--grid); }
.wk:last-child { border-bottom: 0; }
.wk.current { background: var(--surface-2); }
.wk .t { grid-area: t; min-width: 0; }
.wk .t b { display: block; font: 600 18px/1.2 var(--display); }
.wk .shape { grid-area: shape; }
.wk .nums { grid-area: nums; text-align: right; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wk .chev { grid-area: chev; }
@media (max-width: 600px) {
  .wk { grid-template-columns: auto minmax(0, 1fr) 14px; grid-template-areas: "t t chev" "shape nums chev"; }
}
.shape { display: grid; grid-template-columns: repeat(7, 12px); gap: 3px; align-items: end; }
.shape .c { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 40px; }
.shape .b { width: 10px; border-radius: 3px 3px 0 0; background: var(--int-easy); }
.shape .b.moderate { background: var(--int-moderate); }
.shape .b.hard { background: var(--int-hard); }
.shape .b.none { background: var(--grid); border-radius: 1px; }
.shape .m { font-size: 10px; line-height: 12px; height: 12px; color: var(--ink-2); }

/* plan: timeline */
.timeline { position: relative; margin: 0 8px 6px 34px; }
.tl-lane { position: relative; height: 42px; margin-bottom: 4px; }
.tl-block { position: absolute; top: 0; bottom: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; overflow: hidden; color: var(--ink); font-size: 12px; line-height: 1.3; white-space: nowrap; }
.tl-block:hover { text-decoration: none; border-color: var(--ink-2); }
.tl-block.current { box-shadow: inset 0 0 0 2px var(--series-1); }
.tl-block b, .tl-block span { display: block; overflow: hidden; text-overflow: ellipsis; }
.tl-block b { font: 600 14px/1.25 var(--display); }
.tl-block span { color: var(--ink-2); }
.tl-mark { position: absolute; top: -2px; bottom: -2px; border-left: 1px solid var(--ink-2); pointer-events: none; }
.tl-mark.event { border-left-style: dashed; }

/* plan: week view */
.dayrow { grid-template-columns: 56px minmax(0, 1fr) 14px; gap: 12px; padding: 12px 8px; border-bottom: 1px solid var(--grid); }
.dayrow:last-child { border-bottom: 0; }
.dayrow.today { background: var(--surface-2); }
.dayrow.past { opacity: .85; }
.dayrow .when { font-size: 13px; color: var(--ink-2); }
.dayrow .when b { display: block; color: var(--ink); font: 600 18px/1.1 var(--display); }
.split { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin: 6px 0; }
.split span { background: var(--c); }

/* plan: session view */
.kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.targets-box { background: var(--surface-2); border-left: 4px solid var(--int-easy); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
.targets-box.moderate { border-color: var(--int-moderate); }
.targets-box.hard { border-color: var(--int-hard); }
.rich { font-size: 14px; }
.rich p { margin: 0 0 8px; }
.rich .step { display: grid; grid-template-columns: minmax(80px, 140px) 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.rich .step.plain { grid-template-columns: 1fr; }
.rich .step b { font-weight: 600; }
.rich ul, .rich ol { margin: 0 0 8px; padding-left: 20px; }
.rich li { margin: 3px 0; }
.rich h4 { font-size: 13px; margin: 12px 0 4px; color: var(--ink-2); }
.rich table { margin: 4px 0 10px; }
.meter { margin: 10px 0; }
.meter .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); }
.meter .lbl b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter .track { position: relative; height: 10px; background: var(--grid); border-radius: 5px; margin-top: 4px; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 5px; }
.meter .target { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.ride { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.ride:last-child { border-bottom: 0; }
.sport { display: inline-block; font: 600 11px/1.5 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); margin-right: 6px; vertical-align: 2px; }

/* The col marker: the white post with the yellow cap at every kilometre of a mountain pass.
   Here it counts down to the next race (or the end of the current block). */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.borne { width: 116px; text-align: center; color: var(--marker-ink); font-family: var(--display); }
.borne .cap { background: var(--col-yellow); border: 2px solid var(--marker-ink); border-bottom: 0; border-radius: 58px 58px 0 0; padding: 16px 8px 6px; font-weight: 700; font-size: 15px; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.borne .post { background: #fff; border: 2px solid var(--marker-ink); border-radius: 0 0 3px 3px; padding: 4px 6px 8px; }
.borne b { display: block; font-size: 52px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.borne .unit { display: block; font-size: 15px; font-weight: 600; line-height: 1.1; }
.borne small { display: block; font: 500 11px/1.3 var(--body); color: #43474b; margin-top: 5px; }
@media (max-width: 420px) { .borne { width: 100px; } .borne b { font-size: 44px; } }
.banner { border-left: 4px solid var(--warning); }
.banner.bad { border-left-color: var(--critical); }
.choice { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 6px; }
.option { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
.option.active { border-color: var(--series-1); box-shadow: inset 0 0 0 1px var(--series-1); }
.option h3 { margin: 0 0 4px; font: 600 20px/1.2 var(--display); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.option p { margin: 6px 0; font-size: 14px; color: var(--ink-2); }
.state { font: 600 12px/1.4 var(--body); letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.state.on { color: var(--good-text); }
.field { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.field input { flex: 1 1 200px; min-width: 0; font: 15px/1.3 var(--body); padding: 8px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--ink); }
.btn { font: 600 15px/1.2 var(--body); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.btn.link { border: 0; background: none; padding: 8px 4px; color: var(--link); }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 10px; overflow: hidden; margin-top: 6px; flex-wrap: wrap; }
.seg button { font: 600 16px/1.2 var(--display); padding: 9px 16px; border: 0; background: var(--surface); color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
.steps { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
.steps li { margin: 3px 0; }
.msg { margin-top: 8px; font-size: 14px; }
.sug { padding: 10px 0; border-top: 1px solid var(--grid); }
.sug:first-of-type { border-top: 0; }
.sug .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.sug.done { opacity: .65; }
.fuel-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--grid); font-size: 14px; }
.fuel-line a { margin-left: auto; }
.fuel-table td { vertical-align: top; }
.fuel-sess + .fuel-sess { margin-top: 6px; }
.fuel-sess > div { font-size: 13px; }
.ladder { position: relative; display: block; width: 72px; height: 6px; margin: 4px 0 0 auto; border-radius: 3px; background: var(--grid); }
.ladder span { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 4px; }
.race-fuel { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.race-fuel:last-of-type { border-bottom: 0; }
.race-fuel .flags { margin: 6px 0 0; }
.calc { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.calc label { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.calc input { font: 15px/1.3 var(--body); padding: 7px 9px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.calc-out { margin-top: 10px; }
.calc-box > summary { font-weight: 600; margin: 12px 0 8px; }

/* sleep */
.finding { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 8px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
.finding:last-child { border-bottom: 0; }
.finding .ic { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 12px/1 var(--body); color: #fff; margin-top: 1px; }
.finding b { font: 600 17px/1.25 var(--display); }
.finding p { grid-column: 2; margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.influence { padding: 12px 0; border-bottom: 1px solid var(--grid); }
.influence:last-child { border-bottom: 0; }
.influence h3 { margin: 0 0 4px; font: 600 17px/1.25 var(--display); display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
.influence p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.influence table { margin-top: 6px; }
/* zones, calendar, races */
.zbars { display: grid; gap: 5px; }
.zrow { display: grid; grid-template-columns: minmax(80px, 150px) minmax(0, 1fr) 104px; gap: 8px; align-items: center; font-size: 13px; }
.zrow .zt { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.zrow .zt span { display: block; height: 100%; background: var(--series-1); border-radius: 5px; }
.zrow .zv { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); gap: 3px; font-size: 11px; }
.cal .h { color: var(--muted); text-align: center; }
.cal .cw { color: var(--muted); align-self: center; white-space: nowrap; }
.cal .c { height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font: 700 12px/1 var(--body); color: #fff; background: var(--surface-2); }
.cal .c.green { background: var(--good); }
.cal .c.amber { background: var(--warning); color: var(--marker-ink); }
.cal .c.red { background: var(--critical); }
.cal .c.none { color: var(--muted); font-weight: 400; }
.cal .c.out { background: transparent; }
.cal .c.today { box-shadow: 0 0 0 2px var(--ink); }
.seg a { display: inline-block; font: 600 16px/1.2 var(--display); padding: 9px 16px; color: var(--ink-2); background: var(--surface); }
.seg a[aria-current="page"] { background: var(--series-1); color: #fff; }
.seg a:hover { text-decoration: none; }
.event-card { border-left: 4px solid var(--col-yellow); }
.event-card.past { border-left-color: var(--grid); }
.chart-label { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 10px 0 2px; }
td.better { color: var(--good-text); }
td.worse { color: var(--critical); }
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <h1 id="title">Coach</h1>
  <div class="meta" id="meta">Loading…</div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap main" id="tabs"></div><div class="wrap sub" id="subtabs"></div></nav>
<main>
  <div id="app"></div>
</main>
<div class="tooltip" id="tip"></div>
<script>
"use strict";
const TABS = () => [["today", "Today"], ["plan", "Plan"], ["races", "Races"], ["sessions", cycling() ? "Rides" : "Sessions"],
  ["sports", cycling() ? "Bike" : "Sports"], ["progress", "Progress"], ["load", "Load"], ["health", "Health"], ["recovery", "Recovery"],
  ["sleep", "Sleep"], ["nutrition", "Nutrition"], ["settings", "Settings"]];
// Sections in the top bar; the pages of the active one show as pills below it.
const SECTIONS = [["today", "Today", ["today"]], ["planning", "Plan", ["plan", "races"]],
  ["training", "Training", ["sessions", "sports", "progress", "load"]], ["body", "Body", ["health", "recovery", "sleep", "nutrition"]],
  ["settings", "Settings", ["settings"]]];
const lastPage = {};  // section -> the page last opened in it, so the section link returns there
const cycling = () => DATA?.app?.focus === "road_cycling";
const watch = () => DATA?.app?.provider_label || "Watch";
const SPORT = { swim: "Swim", bike: "Bike", run: "Run", brick: "Brick", strength: "Strength", mobility: "Mobility", multisport: "Multisport", rest: "Rest", other: "Other" };
const sportTag = (sp) => sp && sp !== "rest" ? `<span class="sport">${esc(SPORT[sp] || sp)}</span>` : "";
const pace = (sec) => { if (!sec) return "–"; const r = Math.round(sec); return `${Math.floor(r / 60)}:${pad(r % 60)}`; };
const STATUS = {
  green: { label: "Ready", color: "var(--good)", icon: "✓" },
  amber: { label: "Caution", color: "var(--warning)", icon: "!" },
  red: { label: "Recover", color: "var(--critical)", icon: "✕" },
};
const DAY_STATUS = {
  done: { label: "Done", color: "var(--good)", icon: "✓", mark: "✓", ink: "var(--good-text)" },
  over: { label: "Done, more than planned", color: "var(--good)", icon: "✓", mark: "✓", ink: "var(--good-text)" },
  partial: { label: "Partial", color: "var(--warning)", icon: "◐", mark: "◐", ink: "var(--ink-2)" },
  missed: { label: "Missed", color: "var(--critical)", icon: "✕", mark: "✕", ink: "var(--critical)" },
  skipped: { label: "Skipped", color: "var(--muted)", icon: "–", mark: "–", ink: "var(--muted)" },
  unplanned: { label: "Unplanned", color: "var(--series-1)", icon: "+", mark: "+", ink: "var(--ink-2)" },
  pending: { label: "Today", color: "var(--muted)", icon: "•", mark: "", ink: "var(--muted)" },
};
const INTENSITY = { rest: "Rest", easy: "Easy", moderate: "Moderate", hard: "Hard" };
const RANK = { rest: 0, easy: 1, moderate: 2, hard: 3 };
const ZONES = [["Z1 Active recovery", 0, 0.55], ["Z2 Endurance", 0.56, 0.75], ["Z3 Tempo", 0.76, 0.90], ["Z4 Threshold", 0.91, 1.05],
  ["Z5 VO2max", 1.06, 1.20], ["Z6 Anaerobic", 1.21, 1.50], ["Z7 Neuromuscular", 1.51, null]];
const WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_MS = 864e5;
let DATA = null, POST = [], lastHash = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 0) => {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  const s = Number(v).toFixed(d);
  return /^-0(\.0+)?$/.test(s) ? s.slice(1) : s;
};
const pad = (n) => String(n).padStart(2, "0");
const pd = (s) => new Date(s + "T12:00:00");
const iso = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const addDays = (s, n) => { const dt = pd(s); dt.setDate(dt.getDate() + n); return iso(dt); };
const mondayOf = (s) => addDays(s, -((pd(s).getDay() + 6) % 7));
const dshort = (s) => pd(s).toLocaleDateString(undefined, { day: "numeric", month: "short" });
const dlong = (s) => pd(s).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
const wday = (s) => WD[(pd(s).getDay() + 6) % 7];
const hm = (min) => { if (!min) return ""; const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? `${h}h${m ? pad(m) : ""}` : `${m}min`; };
const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
// "Engadin Radmarathon - Prolog (Bergzeitfahren …)" -> "Engadin Radmarathon - Prolog", at most 26 characters.
const shortName = (n, max = 26) => { const s = String(n || "").split(" (")[0].trim(); return s.length > max ? s.slice(0, max - 1).trimEnd() + "…" : s; };
const typeName = (t) => (t || "other").replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
const sessTss = (s) => s.tss ?? s.tss_est ?? null;
const todayKey = () => DATA.generated.slice(0, 10);
const secs = (t) => (t || "").split(":").reduce((a, x) => a * 60 + Number(x), 0);

// ---------------------------------------------------------------- plan index
const planDays = () => DATA.plan.weeks.flatMap((w) => w.days);
const dayOf = (key) => planDays().find((x) => x.date === key);
const weekOf = (key) => DATA.plan.weeks.find((w) => w.week_of === key);
const blockById = (id) => DATA.plan.blocks.find((b) => String(b.id) === String(id));
const currentWeek = () => DATA.plan.weeks.find((w) => w.days.some((x) => x.is_today));
// Re-planning can leave overlapping blocks; the most recently saved one wins.
const weekBlock = (w) => blockById(Math.max(...(w.block_ids.length ? w.block_ids : [-1])));
const blockOfDay = (key) => [...DATA.plan.blocks].sort((a, b) => b.id - a.id).find((b) => b.start_date <= key && key <= b.end_date);
function blockWeekNo(b, weekKey) {
  const s = pd(mondayOf(b.start_date));
  return { n: Math.round((pd(weekKey) - s) / (7 * DAY_MS)) + 1, total: Math.round((pd(mondayOf(b.end_date)) - s) / (7 * DAY_MS)) + 1 };
}
const blockWeeks = (b) => DATA.plan.weeks.filter((w) => w.week_of <= b.end_date && addDays(w.week_of, 6) >= b.start_date);
const hardest = (ss) => ss.reduce((a, s) => (RANK[s.intensity] ?? 1) > (RANK[a] ?? -1) ? s.intensity : a, null);
const activeSessions = (x) => x.sessions.filter((s) => s.status !== "skipped" && s.type !== "rest");

function badge(st) {
  const key = (st || "").split(" ")[0];
  let s = DAY_STATUS[key];
  if (!s) return "";
  // Volume done but the key intensity wasn't: show it as a partial, not a success.
  if (st.includes("intensity missing")) s = { ...DAY_STATUS.partial, label: "Done, intensity missing" };
  const miss = st.match(/\((\w[\w/]*) missing\)/);
  if (miss) s = { ...DAY_STATUS.partial, label: `Partial: ${miss[1]} missing` };
  return `<span class="badge"><span class="dot" style="background:${s.color}"></span>${s.icon} ${esc(s.label)}</span>`;
}
function dayMark(st) {
  const key = (st || "").split(" ")[0];
  const s = st && st.includes("intensity missing") ? DAY_STATUS.partial : DAY_STATUS[key];
  return s && s.mark ? `<span style="color:${s.ink}">${s.mark}</span>` : "";
}

// ---------------------------------------------------------------- tooltip
const tip = document.getElementById("tip");
function showTip(html, x, y) { tip.innerHTML = html; tip.style.left = x + "px"; tip.style.top = (y - 10) + "px"; tip.style.opacity = 1; }
function hideTip() { tip.style.opacity = 0; }

// ---------------------------------------------------------------- charts (inline SVG)
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}
const mount = (id, fn) => POST.push(() => { const c = document.getElementById(id); if (c) fn(c); });

/* Line chart with history (solid) and projection (dashed), shared crosshair + tooltip.
   opts: { rows, series:[{key,label,color}], height, zeroLine, todayKey, events, tipRows, band, connect, dots, decimals } */
function lineChart(container, opts) {
  container.innerHTML = "";
  const W = container.clientWidth || 600, H = opts.height || 200, m = { l: 34, r: 8, t: 8, b: 22 };
  const rows = opts.rows, n = rows.length;
  const vals = rows.flatMap((r) => opts.series.map((s) => r[s.key])).filter((v) => v !== null && v !== undefined);
  if (!n || !vals.length) { container.innerHTML = '<div class="empty">No data yet.</div>'; return; }
  if (opts.band) vals.push(...opts.band);
  let lo = Math.min(...vals, opts.zeroLine ? 0 : Infinity), hi = Math.max(...vals, opts.zeroLine ? 0 : -Infinity);
  if (!opts.zeroLine) lo = Math.max(0, lo - (hi - lo) * 0.1 - (hi === lo ? 1 : 0));
  hi += (hi - lo) * 0.08 || 1;
  const ticks = niceTicks(lo, hi); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const x = (i) => m.l + (i / Math.max(1, n - 1)) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - (v - lo) / (hi - lo || 1)) * (H - m.t - m.b);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": opts.aria || "" }, container);

  if (opts.band) el("rect", { x: m.l, width: W - m.l - m.r, y: y(opts.band[1]), height: Math.max(0, y(opts.band[0]) - y(opts.band[1])), fill: "var(--band)" }, svg);
  for (const t of ticks) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 && opts.zeroLine ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    const tx = el("text", { x: m.l - 6, y: y(t) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, svg); tx.textContent = t;
  }
  // x labels: first of each month
  let lastMonth = null;
  rows.forEach((r, i) => {
    const mo = r.date.slice(0, 7);
    if (mo !== lastMonth && i > 2 && i < n - 3) {
      const t = el("text", { x: x(i), y: H - 4, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, svg);
      t.textContent = pd(r.date).toLocaleDateString(undefined, { month: "short" });
    }
    lastMonth = mo;
  });
  const ti = rows.findIndex((r) => r.date === opts.todayKey);
  if (ti >= 0 && ti < n - 1) {
    el("line", { x1: x(ti), x2: x(ti), y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1 }, svg);
    const t = el("text", { x: x(ti) + 4, y: m.t + 10, fill: "var(--muted)", "font-size": 11 }, svg); t.textContent = "today → plan";
  }
  // Event names at the bottom of the plot (clear of "today → plan" at the top), shortened and stacked in up to
  // three rows so neighbouring races don't overlap; the full name is in the tooltip.
  const lanes = [];
  for (const ev of [...(opts.events || [])].sort((a, b) => a.date.localeCompare(b.date))) {
    const i = rows.findIndex((r) => r.date === ev.date);
    if (i < 0) continue;
    el("line", { x1: x(i), x2: x(i), y1: m.t, y2: H - m.b, stroke: "var(--ink-2)", "stroke-width": 1 }, svg);
    const label = shortName(ev.name), w = label.length * 6 + 4;
    const before = x(i) - 4 - w >= m.l;
    const left = before ? x(i) - 4 - w : x(i) + 4;
    let lane = lanes.findIndex((end) => end < left - 4);
    if (lane < 0 && lanes.length < 3) lane = lanes.push(-Infinity) - 1;
    if (lane < 0) continue;
    lanes[lane] = left + w;
    const t = el("text", { x: before ? x(i) - 4 : x(i) + 4, y: H - m.b - 6 - lane * 13, "text-anchor": before ? "end" : "start", fill: "var(--ink-2)", "font-size": 11,
      "paint-order": "stroke", stroke: "var(--surface)", "stroke-width": 3 }, svg);
    t.textContent = label;
  }
  for (const s of opts.series) {
    const seg = (pred, dashed) => {
      let d = "", pen = false;
      rows.forEach((r, i) => {
        const v = r[s.key];
        if (v === null || v === undefined) { if (!opts.connect) pen = false; return; }
        if (!pred(r, i)) { pen = false; return; }
        d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true;
      });
      if (d) el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": dashed ? "5 4" : "none" }, svg);
    };
    seg((r, i) => !r.projected || (i > 0 && !rows[i - 1].projected), false);
    seg((r, i) => r.projected || (i < n - 1 && rows[i + 1].projected), true);
    if (opts.dots) rows.forEach((r, i) => { if (r[s.key] !== null && r[s.key] !== undefined) el("circle", { cx: x(i), cy: y(r[s.key]), r: 3, fill: s.color, stroke: "var(--surface)", "stroke-width": 1.5 }, svg); });
    const li = ti >= 0 ? ti : (() => { for (let i = n - 1; i >= 0; i--) if (rows[i][s.key] !== null && rows[i][s.key] !== undefined) return i; return -1; })();
    if (li >= 0 && rows[li][s.key] !== null && rows[li][s.key] !== undefined && opts.endLabels) {
      el("circle", { cx: x(li), cy: y(rows[li][s.key]), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
    }
  }
  // hover layer
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink-2)", "stroke-width": 1, opacity: 0 }, svg);
  const dots = opts.series.map((s) => el("circle", { r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }, svg));
  const hit = el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" }, svg);
  const move = (ev) => {
    const box = svg.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - box.left) * (W / box.width);
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / (W - m.l - m.r)) * (n - 1))));
    const r = rows[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    opts.series.forEach((s, k) => {
      const v = r[s.key];
      if (v === null || v === undefined) { dots[k].setAttribute("opacity", 0); return; }
      dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(v)); dots[k].setAttribute("opacity", 1);
    });
    const lines = (opts.tipRows || opts.series.map((s) => [s.label, s.key, s.color])).map(([label, key, color]) =>
      `<div>${color ? `<span class="k" style="background:${color}"></span>` : ""}${esc(label)}: <b>${fmt(r[key], opts.decimals || 0)}</b></div>`).join("");
    const cbox = container.getBoundingClientRect();
    const evs = (opts.events || []).filter((e) => e.date === r.date).map((e) => `<div>⚑ ${esc(e.name)}</div>`).join("");
    showTip(`<div><b>${esc(dshort(r.date))}</b>${r.projected ? " · planned" : ""}</div>${evs}${lines}`,
      cbox.left + window.scrollX + (x(i) / W) * box.width, cbox.top + window.scrollY + (Math.min(...opts.series.map((s) => r[s.key] ?? hi).map(y)) / H) * box.height);
  };
  const leave = () => { cross.setAttribute("opacity", 0); dots.forEach((d) => d.setAttribute("opacity", 0)); hideTip(); };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", () => setTimeout(leave, 1500));
}

/* Weekly TSS: planned as an outlined target bar, done as a solid bar inside it. Click a week to open it.
   items: [{ key, planned, actual, current, href, tip }] */
function weekBars(container, items, opts = {}) {
  container.innerHTML = "";
  const W = container.clientWidth || 600, H = opts.height || 150, m = { l: 34, r: 8, t: 8, b: 22 }, n = items.length;
  if (!n) return;
  const hi0 = Math.max(10, ...items.map((w) => Math.max(w.planned || 0, w.actual || 0)));
  const ticks = niceTicks(0, hi0 * 1.05), hi = ticks[ticks.length - 1];
  const band = (W - m.l - m.r) / n, bw = Math.max(6, Math.min(30, band * 0.68));
  const y = (v) => m.t + (1 - v / hi) * (H - m.t - m.b), base = y(0);
  const top = (cx, w, v) => { const h = base - y(v), r = Math.min(4, w / 2, h); return `M${cx - w / 2},${base}V${base - h + r}Q${cx - w / 2},${base - h} ${cx - w / 2 + r},${base - h}H${cx + w / 2 - r}Q${cx + w / 2},${base - h} ${cx + w / 2},${base - h + r}V${base}Z`; };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": opts.aria || "Weekly TSS" }, container);
  for (const t of ticks) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    const tx = el("text", { x: m.l - 6, y: y(t) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, svg); tx.textContent = t;
  }
  // Date labels: the current week always, others only where they don't crowd a neighbour.
  const cx = (i) => m.l + band * (i + 0.5), cur = items.findIndex((w) => w.current), placed = cur >= 0 ? [cur] : [];
  items.forEach((w, i) => { if (placed.every((j) => Math.abs(cx(i) - cx(j)) >= 56)) placed.push(i); });
  for (const i of placed) {
    const t = el("text", { x: cx(i), y: H - 4, "text-anchor": "middle", fill: i === cur ? "var(--ink)" : "var(--muted)", "font-size": 11, "font-weight": i === cur ? 600 : 400 }, svg);
    t.textContent = i === cur ? "this wk" : dshort(items[i].key);
  }
  items.forEach((w, i) => {
    if (w.planned) el("path", { d: top(cx(i), bw, w.planned), fill: "var(--surface-2)", stroke: "var(--muted)", "stroke-width": 1.25 }, svg);
    if (w.actual) el("path", { d: top(cx(i), Math.max(3, bw - 8), w.actual), fill: "var(--series-1)", stroke: "var(--surface)", "stroke-width": 1.5 }, svg);
    const hit = el("rect", { x: m.l + band * i, y: 0, width: band, height: H, fill: "transparent", style: w.href ? "cursor:pointer" : "" }, svg);
    const show = () => {
      const box = svg.getBoundingClientRect();
      showTip(w.tip, box.left + window.scrollX + (cx(i) / W) * box.width, box.top + window.scrollY + (y(Math.max(w.planned || 0, w.actual || 0)) / H) * box.height);
    };
    hit.addEventListener("mousemove", show); hit.addEventListener("touchstart", show, { passive: true });
    hit.addEventListener("mouseleave", hideTip); hit.addEventListener("touchend", () => setTimeout(hideTip, 1500));
    if (w.href) hit.addEventListener("click", () => { hideTip(); location.hash = w.href; });
  });
}
const BAR_LEGEND = '<div class="legend"><span class="key"><span class="sw outline"></span>Planned TSS</span><span class="key"><span class="sw" style="background:var(--series-1)"></span>Done TSS</span></div>';

function sparkline(svgHost, rows, key, unit, decimals) {
  const pts = rows.map((r, i) => [i, r[key]]).filter(([, v]) => v !== null && v !== undefined);
  svgHost.innerHTML = "";
  if (pts.length < 2) return;
  const W = 200, H = 36, n = rows.length;
  const vs = pts.map((p) => p[1]); let lo = Math.min(...vs), hi = Math.max(...vs); if (hi === lo) { hi += 1; lo -= 1; }
  const x = (i) => (i / (n - 1)) * W, y = (v) => 3 + (1 - (v - lo) / (hi - lo)) * (H - 6);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", "aria-hidden": "true" }, svgHost);
  el("path", { d: pts.map(([i, v], k) => (k ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(""), fill: "none", stroke: "var(--spark)", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }, svg);
  const [li, lv] = pts[pts.length - 1];
  const dot = document.createElement("div");
  svgHost.style.position = "relative";
  dot.style.cssText = `position:absolute;width:8px;height:8px;border-radius:50%;background:var(--series-1);box-shadow:0 0 0 2px var(--surface-2);left:calc(${(x(li) / W) * 100}% - 4px);top:${y(lv) - 4}px`;
  svgHost.appendChild(dot);
  svgHost.onmousemove = svgHost.ontouchstart = (ev) => {
    const box = svgHost.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - box.left) / box.width;
    const i = Math.max(0, Math.min(n - 1, Math.round(px * (n - 1))));
    const r = rows[i];
    showTip(`<b>${esc(dshort(r.date))}</b> · ${r[key] === null || r[key] === undefined ? "no data" : fmt(r[key], decimals) + " " + unit}`, box.left + window.scrollX + px * box.width, box.top + window.scrollY);
  };
  svgHost.onmouseleave = hideTip; svgHost.ontouchend = () => setTimeout(hideTip, 1500);
}

function meter(label, actual, planned, unit, dec = 0) {
  const max = Math.max(actual || 0, planned || 0) || 1;
  return `<div class="meter"><div class="lbl"><span>${esc(label)}</span><span><b>${fmt(actual, dec)}</b> of ${fmt(planned, dec)}${esc(unit)}</span></div>
    <div class="track"><div class="fill" style="width:${((actual || 0) / max) * 100}%"></div>${planned ? `<div class="target" style="left:${(planned / max) * 100}%"></div>` : ""}</div></div>`;
}

// Workout text from the coach: markdown-ish tables, lists, headings and "Label: text" steps.
function richText(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i].trim();
    if (!l) { i++; continue; }
    if (l.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++].trim());
      const sepAt = rows.findIndex((r) => /^[\s|:-]+$/.test(r));
      const head = sepAt === 1 ? cells(rows[0]) : null;
      const body = rows.filter((r, k) => k !== sepAt && !(head && k === 0)).map(cells);
      out += `<div class="scroll"><table>${head ? `<thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^([-*•]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\d/.test(l), items = [];
      while (i < lines.length && /^([-*•]|\d+[.)])\s+/.test(lines[i].trim())) items.push(lines[i++].trim().replace(/^([-*•]|\d+[.)])\s+/, ""));
      out += `<${ordered ? "ol" : "ul"}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`;
      continue;
    }
    if (/^#{1,6}\s/.test(l)) { out += `<h4>${inline(l.replace(/^#+\s*/, ""))}</h4>`; i++; continue; }
    const m = l.match(/^([A-Za-zÄÖÜäöüß][\w ()/+&-]{0,28}):\s+(.+)$/);
    out += m ? `<div class="step"><b>${inline(m[1])}</b><span>${inline(m[2])}</span></div>` : `<div class="step plain">${inline(l)}</div>`;
    i++;
  }
  return `<div class="rich">${out}</div>`;
}

function weekRow(w, maxT) {

function healthTiles(d, prefix) {
  const rows = d.health.slice(-30), all = d.health, r = d.readiness || {};
  const last = (k) => { for (let i = rows.length - 1; i >= 0; i--) if (rows[i][k] !== null && rows[i][k] !== undefined) return rows[i][k]; return null; };
  const avg = (k, n) => mean(all.slice(-n - 1, -1).map((x) => x[k]).filter((v) => v !== null && v !== undefined));
  const delta = (k, n, upGood, unit, dec = 0) => {
    const v = last(k), a = avg(k, n); if (v === null || a === null) return { text: "", cls: "" };
    const dv = v - a; if (Math.abs(dv) < 10 ** -dec / 2) return { text: `= ${n}-day avg`, cls: "" };
    return { text: `${dv > 0 ? "▲" : "▼"} ${fmt(Math.abs(dv), dec)}${unit} vs ${n}-day avg`, cls: (dv > 0) === upGood ? "good" : "bad" };
  };
  const hrvRange = r.hrv?.watch_normal_range?.[0] ? r.hrv.watch_normal_range : r.hrv?.normal_range_60d;
  const coros = d.app.provider === "coros";
  const tiles = [
    { label: "HRV last night", key: "hrv", unit: "ms", dec: 0, d: delta("hrv", 30, true, " ms"), extra: hrvRange ? `normal ${fmt(hrvRange[0])}–${fmt(hrvRange[1])}` : "" },
    { label: "Resting HR", key: "rhr", unit: "bpm", dec: 0, d: delta("rhr", 30, false, " bpm") },
    { label: "Sleep", key: "sleep_h", unit: "h", dec: 1, d: delta("sleep_h", 7, true, " h", 1), extra: last("sleep_score") !== null ? `score ${fmt(last("sleep_score"))}` : "" },
    coros ? { label: "COROS recovery", key: "recovery_pct", unit: "%", dec: 0, value: r.recovery?.pct ?? last("recovery_pct"), d: { text: r.recovery?.level || "", cls: "" } }
      : { label: "Body Battery (wake/high)", key: "bb_high", unit: "", dec: 0, value: r.recovery?.wake ?? last("bb_high"), d: delta("bb_high", 7, true, "") },
    { label: "Stress (avg)", key: "stress_avg", unit: "", dec: 0, d: delta("stress_avg", 30, false, "") },
    { label: "Weight", key: "weight_kg", unit: "kg", dec: 1, value: d.weight_kg, d: coros ? { text: "", cls: "" } : delta("weight_kg", 30, false, " kg", 1), extra: d.athlete.wkg ? `${fmt(d.athlete.wkg, 2)} W/kg at FTP ${fmt(d.athlete.ftp)}` : coros ? "from the COROS profile" : "" },
  ];
  tiles.forEach((t, i) => mount(`${prefix}${i}`, (c) => sparkline(c, rows, t.key, t.unit, t.dec)));
  return `<div class="tiles">${tiles.map((t, i) => `<div class="tile"><div class="label">${esc(t.label)}</div><div class="value">${fmt(t.value ?? last(t.key), t.dec)}<small>${esc(t.unit)}</small></div>
    <div class="delta ${t.d.cls}">${esc([t.d.text, t.extra].filter(Boolean).join(" · "))}</div><div id="${prefix}${i}"></div></div>`).join("")}</div>`;
}

    series: [{ key: "ctl", label: "Fitness (CTL)", color: "var(--series-1)" }, { key: "atl", label: "Fatigue (ATL)", color: "var(--series-2)" }],
