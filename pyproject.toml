[project]
name = "endurance-coach"
version = "0.2.0"
description = "Local MCP server and dashboard that turn Garmin or COROS data into a road-cycling or triathlon coach for Claude."
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python>=1.0",
    "mcp>=2.3",
    "fitdecode>=0.11",
    "numpy>=2.0",
    "requests>=2.31",
]

[project.scripts]
coach = "endurance_coach.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["endurance_coach"]

[tool.setuptools.package-data]
endurance_coach = ["dashboard.html"]
